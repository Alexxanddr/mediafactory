apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: nfs-csi-bootstrap
  namespace: flux-system
spec:
  dependsOn:
    - name: mergerfs-bootstrap
  path: flux/infrastructure/nfs-csi/
  interval: 10m
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: nfs-csi
      namespace: kube-system
