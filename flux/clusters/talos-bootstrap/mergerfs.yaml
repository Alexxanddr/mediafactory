apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mergerfs-bootstrap
  namespace: flux-system
spec:
  path: flux/apps/mergerfs/
  interval: 10m
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: mergerfs
      namespace: mergerfs
    - apiVersion: apps/v1
      kind: Deployment
      name: nfs-ganesha
      namespace: mergerfs
