# Tailnet policy and enrollment configured; the public OCI relay is enabled separately.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: traefik-plex
  namespace: flux-system
spec:
  suspend: false
  dependsOn:
  - name: infrastructure
  - name: apps
  path: flux/networking/traefik-plex/
  interval: 10m
  timeout: 10m
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  healthChecks:
  - apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    name: traefik-plex
    namespace: traefik-plex
  - apiVersion: cert-manager.io/v1
    kind: ClusterIssuer
    name: letsencrypt-production
  - apiVersion: cert-manager.io/v1
    kind: Certificate
    name: plex-remote
    namespace: traefik-plex
