apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-restore-check
  namespace: database
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-system-trixie
  bootstrap:
    recovery:
      volumeSnapshots:
        storage:
          name: postgres-longhorn-daily-20261102114905
          kind: VolumeSnapshot
          apiGroup: snapshot.storage.k8s.io
  storage:
    storageClass: longhorn-retain
    size: 50Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
