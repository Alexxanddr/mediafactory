apiVersion: v1
kind: PersistentVolume
metadata:
  name: mediafactory-root-nfs
spec:
  accessModes: [ReadWriteMany]
  capacity:
    storage: 100Gi
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-csi
  mountOptions: [nfsvers=4.1]
  volumeMode: Filesystem
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: 192.168.20.3#/MediaFactory#mediafactory-root-nfs
    volumeAttributes:
      server: 192.168.20.3
      share: /MediaFactory
---
