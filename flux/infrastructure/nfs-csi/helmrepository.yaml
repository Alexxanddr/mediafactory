apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: nfs-csi
  namespace: flux-system
spec:
  interval: 24h
  url: https://kubernetes-csi.github.io/csi-driver-nfs
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nfs-csi
  namespace: kube-system
spec:
  interval: 15m
  timeout: 10m
  chart:
    spec:
      chart: csi-driver-nfs
      version: 4.13.4
      sourceRef:
        kind: HelmRepository
        name: nfs-csi
        namespace: flux-system
      interval: 1h
  releaseName: nfs-csi
  values:
    controller:
      replicas: 1
      runOnControlPlane: true
      enableSnapshotter: false
