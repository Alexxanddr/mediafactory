apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nfs-csi-mediafactory
provisioner: nfs.csi.k8s.io
parameters:
  server: 192.168.20.3
  share: /MediaFactory
  subDir: "${pvc.metadata.namespace}/${pvc.metadata.name}"
mountOptions:
  - nfsvers=4.1
  - proto=tcp
reclaimPolicy: Retain
volumeBindingMode: Immediate
allowVolumeExpansion: true
