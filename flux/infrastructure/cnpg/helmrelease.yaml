apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudnative-pg
  namespace: database
spec:
  interval: 30m

  chart:
    spec:
      chart: cloudnative-pg
      sourceRef:
        kind: HelmRepository
        name: cloudnative-pg
        namespace: flux-system

  install:
    createNamespace: false
    remediation:
      retries: 3

  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true

  values:
    podAnnotations:
      uptime-kuma.io/enabled: "true"
      uptime-kuma.io/type: "port"
      uptime-kuma.io/url: "cnpg-webhook-service.database.svc"
      uptime-kuma.io/port: "443"
      uptime-kuma.io/name: "cloudnative-pg-operator"
      uptime-kuma.io/interval: "60"
      uptime-kuma.io/retries: "3"
      uptime-kuma.io/notifications: "Monitoring Bot"
      uptime-kuma.io/group: "Storage & Databases"
    config:
      clusterWide: true