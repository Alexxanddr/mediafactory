apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: longhorn
  namespace: flux-system
spec:
  interval: 24h
  url: https://charts.longhorn.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  interval: 15m
  timeout: 15m
  chart:
    spec:
      chart: longhorn
      version: 1.13.0
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: flux-system
      interval: 1h
  releaseName: longhorn
  install:
    crds: Create
  values:
    defaultBackupStore:
      backupTarget: "nfs://192.168.20.3:/MediaFactory/longhorn-backup"
      pollInterval: 300
    persistence:
      defaultClass: false
      defaultClassReplicaCount: 1
    defaultSettings:
      defaultReplicaCount: 1
    longhornManager:
      replicas: 1
    longhornUI:
      replicas: 1
    csi:
      attacherReplicaCount: 1
      provisionerReplicaCount: 1
      resizerReplicaCount: 1
      snapshotterReplicaCount: 1
