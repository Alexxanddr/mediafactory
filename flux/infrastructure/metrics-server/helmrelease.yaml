apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metrics-server
  namespace: system-addon
spec:
  interval: 1h
  chart:
    spec:
      chart: metrics-server
      version: 3.14.0
      sourceRef:
        kind: HelmRepository
        name: metrics-server
        namespace: flux-system
      interval: 1h
  values:
    # Talos kubelets commonly use serving certificates that aren't trusted by
    # metrics-server; keep API aggregation TLS verification enabled separately.
    args:
      - --kubelet-insecure-tls
