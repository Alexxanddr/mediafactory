apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nvidia
  namespace: nvidia-operator

spec:
  interval: 30m

  chart:
    spec:
      chart: gpu-operator
      sourceRef:
        kind: HelmRepository
        name: nvidia-gpu-operator
        namespace: flux-system
      interval: 1h

  values:
    daemonsets:
      annotations:
        keel.sh/policy: force
        keel.sh/trigger: poll
        keel.sh/matchTag: "true"
    driver:
      enabled: false

    hostPaths:
      driverInstallDir: /usr/local

    cdi:
      enabled: true

    operator:
      annotations:
        uptime-kuma.io/enabled: "true"
        uptime-kuma.io/status-page: "true"
        uptime-kuma.io/type: "http"
        uptime-kuma.io/url: "http://gpu-operator.nvidia-operator.svc:8080"
        uptime-kuma.io/name: "nvidia-operator"
        uptime-kuma.io/interval: "60"
        uptime-kuma.io/retries: "3"
        uptime-kuma.io/notifications: "Monitoring Bot"
        uptime-kuma.io/status-codes: "404"
        uptime-kuma.io/group: "Monitoring & Observability"

    toolkit:
      enabled: false

    devicePlugin:
      enabled: true

      env:
        - name: NVIDIA_CDI_HOOK_PATH
          value: /usr/local/bin/nvidia-cdi-hook

      config:
        name: time-slicing-config-all

    gfd:
      enabled: true

    dcgmExporter:
      enabled: true

      annotations:
        uptime-kuma.io/enabled: "true"
        uptime-kuma.io/status-page: "true"
        uptime-kuma.io/type: "http"
        uptime-kuma.io/url: "http://nvidia-dcgm-exporter.nvidia-operator.svc:9400/metrics"
        uptime-kuma.io/name: "nvidia-dcgm-exporter"
        uptime-kuma.io/interval: "60"
        uptime-kuma.io/retries: "3"
        uptime-kuma.io/notifications: "Monitoring Bot"
        uptime-kuma.io/group: "Monitoring & Observability"
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: (Deployment|DaemonSet)
            patch: |-
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: keel-workload-annotations
                annotations:
                  keel.sh/policy: force
                  keel.sh/trigger: poll
                  keel.sh/matchTag: "true"
