apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: redis
  namespace: database
spec:
  interval: 30m
  chart:
    spec:
      chart: redis
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: flux-system

  values:
    architecture: standalone

    auth:
      enabled: true
      existingSecret: redis-auth
      existingSecretPasswordKey: redis-password

    master:
      persistence:
        enabled: true
        existingClaim: redis

      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi