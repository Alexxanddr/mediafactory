apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: redis
  namespace: database
spec:
  interval: 30m

  chartRef:
    kind: OCIRepository
    name: redis
    namespace: flux-system

  values:
    architecture: standalone

    auth:
      enabled: true
      existingSecret: redis-auth
      existingSecretPasswordKey: redis-password

    master:
      podAnnotations:
        uptime-kuma.io/enabled: "true"
        uptime-kuma.io/type: "port"
        uptime-kuma.io/url: "redis-master.database.svc:6379"
        uptime-kuma.io/name: "redis"
        uptime-kuma.io/interval: "60"
        uptime-kuma.io/retries: "3"
        uptime-kuma.io/notifications: "Monitoring Bot"
        uptime-kuma.io/group: "Storage & Databases"

      persistence:
        enabled: true
        existingClaim: redis

      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi