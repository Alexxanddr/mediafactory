apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: storage-recovery
  namespace: storage-recovery
rules:
- apiGroups:
  - ''
  resources:
  - pods/exec
  verbs:
  - get
  - create
- apiGroups:
  - ''
  resources:
  - configmaps
  resourceNames:
  - storage-recovery
  verbs:
  - get
  - patch
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  resourceNames:
  - storage-recovery
  verbs:
  - get
  - update
