apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik-plex
  namespace: traefik-plex
spec:
  releaseName: traefik-plex
  interval: 5m
  dependsOn:
  - name: traefik
    namespace: system-addon
  - name: cert-manager
    namespace: cert-manager
  - name: crowdsec
    namespace: crowdsec-system
  chart:
    spec:
      chart: traefik
      version: 42.3.1
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
  install:
    crds: Skip
    remediation:
      retries: 3
  upgrade:
    crds: Skip
    remediation:
      retries: 3
  values:
    fullnameOverride: traefik-plex
    image:
      tag: v3.7.17
      pullPolicy: Always
    deployment:
      replicas: 1
      annotations:
        keel.sh/policy: force
        keel.sh/trigger: poll
        keel.sh/matchTag: 'true'
      podAnnotations:
        uptime-kuma.io/enabled: 'true'
        uptime-kuma.io/status-page: 'true'
        uptime-kuma.io/type: http
        uptime-kuma.io/url: http://traefik-plex-health.traefik-plex.svc:8080/ping
        uptime-kuma.io/name: traefik-plex
        uptime-kuma.io/interval: '60'
        uptime-kuma.io/retries: '3'
        uptime-kuma.io/notifications: Monitoring Bot
        uptime-kuma.io/group: Network & Connectivity
        plex-edge/config-revision: '2'
      initContainers:
      - name: firewall
        image: ghcr.io/tailscale/tailscale:latest
        imagePullPolicy: Always
        command:
        - /bin/sh
        - /scripts/firewall.sh
        securityContext:
          runAsUser: 0
          runAsGroup: 0
          runAsNonRoot: false
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
            add:
            - NET_ADMIN
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 250m
            memory: 128Mi
        volumeMounts:
        - name: tailscale-config
          mountPath: /scripts
          readOnly: true
        env:
        - name: PLEX_SERVICE_IP
          valueFrom:
            configMapKeyRef:
              name: traefik-plex-tailscale
              key: PLEX_SERVICE_IP
        - name: LAPI_SERVICE_IP
          valueFrom:
            configMapKeyRef:
              name: traefik-plex-tailscale
              key: LAPI_SERVICE_IP
      additionalVolumes:
      - name: tailscale-config
        configMap:
          name: traefik-plex-tailscale
      - name: tailscale-runtime
        emptyDir: {}
      additionalContainers:
      - name: tailscale
        image: ghcr.io/tailscale/tailscale:latest
        imagePullPolicy: Always
        env:
        - name: TS_USERSPACE
          value: 'true'
        - name: TS_AUTH_ONCE
          value: 'true'
        - name: TS_ACCEPT_DNS
          value: 'false'
        - name: TS_HOSTNAME
          value: plex-ingress
        - name: TS_KUBE_SECRET
          value: traefik-plex-state
        - name: TS_STATE_DIR
          value: /var/run/tailscale
        - name: TS_SOCKET
          value: /var/run/tailscale/tailscaled.sock
        - name: TS_SERVE_CONFIG
          value: /config/serve.json
        - name: TS_EXTRA_ARGS
          value: --advertise-tags=tag:plex-ingress --accept-routes=false
        - name: TS_TAILSCALED_EXTRA_ARGS
          value: --port=41641
        - name: TS_ENABLE_HEALTH_CHECK
          value: 'true'
        - name: TS_LOCAL_ADDR_PORT
          value: 0.0.0.0:9002
        - name: TS_AUTHKEY
          valueFrom:
            secretKeyRef:
              name: traefik-plex-tailscale-auth
              key: TS_AUTHKEY
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tailscale-config
          mountPath: /config
          readOnly: true
        - name: tailscale-runtime
          mountPath: /var/run/tailscale
        - name: tmp
          mountPath: /tmp
        readinessProbe:
          httpGet:
            path: /healthz
            port: 9002
          periodSeconds: 10
          failureThreshold: 6
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 1000m
            memory: 256Mi
    updateStrategy:
      type: Recreate
    service:
      enabled: false
    ingressClass:
      enabled: false
    gateway:
      enabled: false
    gatewayClass:
      enabled: false
    ingressRoute:
      dashboard:
        enabled: false
      healthcheck:
        enabled: false
    api:
      dashboard: false
    providers:
      kubernetesCRD:
        enabled: true
        ingressClass: traefik-plex
        namespaces:
        - traefik-plex
        allowCrossNamespace: false
        allowExternalNameServices: true
      kubernetesIngress:
        enabled: false
      kubernetesGateway:
        enabled: false
    rbac:
      namespaced: true
    ports:
      web: null
      websecure:
        hostIP: 127.0.0.1
        port: 8443
        expose:
          default: false
        proxyProtocol:
          trustedIPs:
          - 127.0.0.1/32
          insecure: false
        transport:
          respondingTimeouts:
            readTimeout: 60s
            writeTimeout: 0s
            idleTimeout: 180s
      metrics: null
    metrics:
      prometheus: null
    experimental:
      abortOnPluginFailure: true
      plugins:
        bouncer:
          moduleName: github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
          version: v1.4.5
    volumes:
    - name: traefik-plex-bouncer
      mountPath: /etc/traefik/crowdsec
      type: secret
    accessLog:
      enabled: true
      format: json
      fields:
        headers:
          defaultMode: drop
        names:
          RequestLine: drop
        queryParameters:
          defaultMode: drop
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 1000m
        memory: 512Mi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      readOnlyRootFilesystem: true
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 65532
      runAsGroup: 65532
      seccompProfile:
        type: RuntimeDefault
      fsGroup: 65532
