apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik-plex
  namespace: traefik-plex
spec:
  releaseName: traefik-plex
  interval: 5m
  dependsOn:
  - name: traefik
    namespace: system-addon
  - name: cert-manager
    namespace: cert-manager
  - name: crowdsec
    namespace: crowdsec-system
  chart:
    spec:
      chart: traefik
      version: 42.3.1
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
  install:
    crds: Skip
    remediation:
      retries: 3
  upgrade:
    crds: Skip
    remediation:
      retries: 3
  values:
    fullnameOverride: traefik-plex
    image:
      tag: v3.7.17
      pullPolicy: Always
    deployment:
      replicas: 1
      annotations:
        keel.sh/policy: force
        keel.sh/trigger: poll
        keel.sh/matchTag: 'true'
      podAnnotations:
        uptime-kuma.io/enabled: 'true'
        uptime-kuma.io/status-page: 'true'
        uptime-kuma.io/type: http
        uptime-kuma.io/url: http://traefik-plex-health.traefik-plex.svc:8080/ping
        uptime-kuma.io/name: traefik-plex
        uptime-kuma.io/interval: '60'
        uptime-kuma.io/retries: '3'
        uptime-kuma.io/notifications: Monitoring Bot
        uptime-kuma.io/group: Network & Connectivity
        plex-edge/config-revision: '4'
      initContainers:
      - name: firewall
        image: docker.io/nicolaka/netshoot:latest
        imagePullPolicy: Always
        command:
        - /bin/sh
        - /scripts/firewall.sh
        securityContext:
          runAsUser: 0
          runAsGroup: 0
          runAsNonRoot: false
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
            add:
            - NET_ADMIN
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 250m
            memory: 128Mi
        volumeMounts:
        - name: plex-firewall
          mountPath: /scripts
          readOnly: true
        env:
        - name: PLEX_SERVICE_IP
          valueFrom:
            configMapKeyRef:
              name: traefik-plex-firewall
              key: PLEX_SERVICE_IP
        - name: LAPI_SERVICE_IP
          valueFrom:
            configMapKeyRef:
              name: traefik-plex-firewall
              key: LAPI_SERVICE_IP
      additionalVolumes:
      - name: plex-firewall
        configMap:
          name: traefik-plex-firewall
    updateStrategy:
      type: Recreate
    service:
      enabled: false
    ingressClass:
      enabled: false
    gateway:
      enabled: false
    gatewayClass:
      enabled: false
    ingressRoute:
      dashboard:
        enabled: false
      healthcheck:
        enabled: false
    api:
      dashboard: false
    providers:
      kubernetesCRD:
        enabled: true
        ingressClass: traefik-plex
        namespaces:
        - traefik-plex
        allowCrossNamespace: false
        allowExternalNameServices: true
      kubernetesIngress:
        enabled: false
      kubernetesGateway:
        enabled: true
        namespaces:
        - traefik-plex
        labelSelector: app.kubernetes.io/instance=traefik-plex-traefik-plex
        gateways:
        - name: traefik-plex-gateway
          namespace: traefik-plex
        crossProviderNamespaces:
        - traefik-plex
        statusAddress:
          service:
            enabled: false
    rbac:
      enabled: false
      namespaced: false
    ports:
      web: null
      websecure:
        port: 8443
        expose:
          default: false
        transport:
          respondingTimeouts:
            readTimeout: 60s
            writeTimeout: 0s
            idleTimeout: 180s
        http:
          tls:
            options: traefik-plex-plex@kubernetescrd
      metrics: null
    metrics:
      prometheus: null
    experimental:
      abortOnPluginFailure: true
      plugins:
        bouncer:
          moduleName: github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
          version: v1.4.5
    volumes:
    - name: traefik-plex-bouncer
      mountPath: /etc/traefik/crowdsec
      type: secret
    accessLog:
      enabled: true
      format: json
      fields:
        headers:
          defaultMode: drop
        names:
          RequestLine: drop
        queryParameters:
          defaultMode: drop
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 1000m
        memory: 512Mi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      readOnlyRootFilesystem: true
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 65532
      runAsGroup: 65532
      seccompProfile:
        type: RuntimeDefault
      fsGroup: 65532
    additionalArguments:
    - --providers.kubernetescrd.disableClusterScopeResources=true
