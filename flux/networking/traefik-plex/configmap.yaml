apiVersion: v1
kind: ConfigMap
metadata:
  name: traefik-plex-firewall
  namespace: traefik-plex
data:
  firewall.sh: |
    #!/bin/sh
    set -eu
    for tool in iptables-restore ip6tables-restore awk; do command -v "$tool" >/dev/null; done
    plex_ip=${PLEX_SERVICE_IP:?Missing Plex ClusterIP}
    lapi_ip=${LAPI_SERVICE_IP:?Missing LAPI ClusterIP}
    dns_ip=$(awk '$1 == "nameserver" && $2 !~ /:/ { print $2; exit }' /etc/resolv.conf)
    api_ip=${KUBERNETES_SERVICE_HOST:?Missing Kubernetes service address}
    api_port=${KUBERNETES_SERVICE_PORT_HTTPS:-443}
    for address in "$plex_ip" "$lapi_ip" "$dns_ip" "$api_ip"; do
        printf '%s\n' "$address" | awk -F. 'NF != 4 { exit 1 } { for (i=1;i<=4;i++) if ($i !~ /^[0-9]+$/ || $i > 255) exit 1 }'
    done

    iptables-restore <<RULES
    *filter
    :INPUT DROP [0:0]
    :FORWARD DROP [0:0]
    :OUTPUT DROP [0:0]
    -A INPUT -i lo -j ACCEPT
    -A INPUT -m conntrack --ctstate INVALID -j DROP
    -A INPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
    -A INPUT -i eth0 -p tcp --dport 8080 -j ACCEPT
    -A INPUT -i eth0 -p tcp --dport 8443 -j ACCEPT
    -A OUTPUT -o lo -j ACCEPT
    -A OUTPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
    -A OUTPUT -d $dns_ip/32 -p udp --dport 53 -j ACCEPT
    -A OUTPUT -d $dns_ip/32 -p tcp --dport 53 -j ACCEPT
    -A OUTPUT -d $api_ip/32 -p tcp --dport $api_port -j ACCEPT
    -A OUTPUT -d $plex_ip/32 -p tcp --dport 32400 -j ACCEPT
    -A OUTPUT -d $lapi_ip/32 -p tcp --dport 8080 -j ACCEPT
    -A OUTPUT -d 0.0.0.0/8 -j REJECT
    -A OUTPUT -d 10.0.0.0/8 -j REJECT
    -A OUTPUT -d 100.64.0.0/10 -j REJECT
    -A OUTPUT -d 127.0.0.0/8 -j REJECT
    -A OUTPUT -d 169.254.0.0/16 -j REJECT
    -A OUTPUT -d 172.16.0.0/12 -j REJECT
    -A OUTPUT -d 192.168.0.0/16 -j REJECT
    -A OUTPUT -d 198.18.0.0/15 -j REJECT
    -A OUTPUT -d 224.0.0.0/4 -j REJECT
    -A OUTPUT -d 240.0.0.0/4 -j REJECT
    # Plugin downloads use public HTTPS; private destinations stay blocked.
    -A OUTPUT -p tcp --dport 443 -j ACCEPT
    COMMIT
    RULES
    ip6tables-restore <<'RULES'
    *filter
    :INPUT DROP [0:0]
    :FORWARD DROP [0:0]
    :OUTPUT DROP [0:0]
    -A INPUT -i lo -j ACCEPT
    -A OUTPUT -o lo -j ACCEPT
    COMMIT
    RULES
  PLEX_SERVICE_IP: 10.97.203.150
  LAPI_SERVICE_IP: 10.104.125.29
