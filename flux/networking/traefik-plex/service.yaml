apiVersion: v1
kind: Service
metadata:
  name: plex-backend
  namespace: traefik-plex
spec:
  type: ExternalName
  externalName: plex-media-server.multimedia-factory.svc.cluster.local
  ports:
  - name: https
    port: 32400
    protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: traefik-plex-health
  namespace: traefik-plex
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/instance: traefik-plex-traefik-plex
  ports:
  - name: health
    port: 8080
    targetPort: traefik
    protocol: TCP
