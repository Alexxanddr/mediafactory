                                        format: double
                                      min:
                                        type: number
                                        description: Minimum value for gauge
                                        format: double
                                      showAbsoluteValue:
                                        type: boolean
                                        description: When true, display raw value instead of percentage
                                      unitOverride:
                                        type: string
