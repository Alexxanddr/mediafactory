apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.exporter.serviceAccount.name}}
  namespace: {{ .Release.Namespace }}

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  namespace: {{ .Release.Namespace }}
  name:  {{ .Values.exporter.clusterRole.name}}
rules:
  # Update leader election leases
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "create", "update", "delete"]
  # The rest of these are just so we can export the state of the cluster
  - apiGroups: [""]
    resources: ["pods", "nodes", "services", "endpoints", "namespaces", "configmaps", "events", "serviceaccounts", "persistentvolumeclaims", "persistentvolumes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [ "networking.k8s.io" ]
    resources: [ "ingresses", "networkpolicies" ]
    verbs: [ "get", "list", "watch" ]
  - apiGroups: [ "monitoring.coreos.com" ]
    resources: [ "alertmanagerconfigs", "alertmanagers", "podmonitors", "probes", "prometheusagents", "prometheuses", "prometheusrules", "scrapeconfigs", "servicemonitors", "thanosrulers" ]
    verbs: [ "get", "list", "watch" ]
  - apiGroups: [ "rbac.metoro.io" ]
    resources: [ "metoronamespacetelemetryrules", "metoroclustertelemetryrules", "metoronamespaceresourcerules", "metoroclusterresourcerules" ]
    verbs: [ "get", "list", "watch" ]
  - apiGroups: [ "observability.metoro.io" ]
    resources: [ "metoroalerts", "metorodashboards", "metorowebhooks", "metoroclusteringestionrules" ]
    verbs: [ "get", "list", "watch" ]
  {{- if and .Values.exporter.secretRefs.enabled .Values.exporter.secretRefs.global }}
  # Opt-in and explicitly global, for mirroring the Secret keys that Metoro
  # CRDs reference by name (e.g. MetoroWebhook secretKeyRefs) to Metoro's
  # encrypted secret store. Deliberately `get` only: the exporter reads
  # referenced Secrets by name and never lists or watches them, so it cannot
  # enumerate cluster Secrets. The default (global: false) uses per-namespace
  # Roles instead; see exporter_secret_reader_rbac.yaml.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
  {{- end }}

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.exporter.clusterRoleBinding.name}}
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.exporter.serviceAccount.name}}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ .Values.exporter.clusterRole.name}}
  apiGroup: rbac.authorization.k8s.io
