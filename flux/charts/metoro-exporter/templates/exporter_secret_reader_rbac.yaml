{{- /*
Namespace-scoped Secret read access for the secret ref syncer (the default
shape of exporter.secretRefs). One get-only Role + RoleBinding per in-scope
namespace: the release namespace always, plus exporter.secretRefs.namespaces.
The exporter physically cannot read Secrets outside these namespaces,
whatever a CRD references. exporter.secretRefs.global swaps this for a
cluster-wide ClusterRole rule (see exporter_service_account.yaml).
*/ -}}
{{- if and .Values.exporter.secretRefs.enabled (not .Values.exporter.secretRefs.global) }}
{{- range $namespace := (concat (list $.Release.Namespace) $.Values.exporter.secretRefs.namespaces | uniq) }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $.Values.exporter.serviceAccount.name }}-secret-reader
  namespace: {{ $namespace }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $.Values.exporter.serviceAccount.name }}-secret-reader
  namespace: {{ $namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $.Values.exporter.serviceAccount.name }}-secret-reader
subjects:
  - kind: ServiceAccount
    name: {{ $.Values.exporter.serviceAccount.name }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
