---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keel
  namespace: system-addon
spec:
  releaseName: keel
  interval: 5m
  chart:
    spec:
      chart: keel
      sourceRef:
        kind: HelmRepository
        name: keel
        namespace: flux-system
  values:
    podAnnotations:
      uptime-kuma.io/enabled: "true"
      uptime-kuma.io/type: "port"
      uptime-kuma.io/url: "keel.system-addon.svc:9300"
      uptime-kuma.io/name: "keel"
      uptime-kuma.io/interval: "60"
      uptime-kuma.io/retries: "3"
      uptime-kuma.io/notifications: "Monitoring Bot"
      uptime-kuma.io/group: "Security & Cluster Management"
    service:
      enabled: true
      type: ClusterIP
      externalPort: 9300
    polling:
      enabled: true
      defaultSchedule: "@every 60m"
    secret:
      name: "keel-secret"
      create: false
    image:
      repository: ghcr.io/keel-hq/keel
      tag: latest
      pullPolicy: Always