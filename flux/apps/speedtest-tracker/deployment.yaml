---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: speedtest-tracker
  namespace: extra-tools
  annotations:
    keel.sh/policy: force
    keel.sh/trigger: poll
    keel.sh/matchTag: "true"
    uptime-kuma.io/enabled: "true"
    uptime-kuma.io/type: "http"
    uptime-kuma.io/url: "http://speedtest-tracker.extra-tools.svc:80"
    uptime-kuma.io/name: "speedtest-tracker"
    uptime-kuma.io/interval: "60"
    uptime-kuma.io/retries: "3"
    uptime-kuma.io/notifications: "Monitoring Bot"
    uptime-kuma.io/group: "Network & Connectivity"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: speedtest-tracker
  template:
    metadata:
      labels:
        app: speedtest-tracker
    spec:
      dnsPolicy: ClusterFirst
      containers:
        - name: speedtest-tracker
          image: lscr.io/linuxserver/speedtest-tracker:latest
          imagePullPolicy: Always
          env:
            - name: PUID
              value: '1000'
            - name: PGID
              value: '1000'
            - name: DISPLAY_TIMEZONE
              value: UTC
            - name: SPEEDTEST_SCHEDULE
              value: 0 * * * *
            - name: SPEEDTEST_SERVERS
              value: '3243'
          envFrom:
            - secretRef:
                name: speedtest-secret
          volumeMounts:
            - mountPath: /config
              name: speedtest-tracker
      volumes:
        - name: speedtest-tracker
          persistentVolumeClaim:
            claimName: speedtest-tracker
