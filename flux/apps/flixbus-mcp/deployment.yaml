apiVersion: apps/v1
kind: Deployment
metadata:
  name: flixbus-mcp
  namespace: extra-tools
  annotations:
    keel.sh/policy: force
    keel.sh/trigger: poll
    keel.sh/matchTag: "true"
    uptime-kuma.io/enabled: "true"
    uptime-kuma.io/type: "tcp"
    uptime-kuma.io/port: "8748"
    uptime-kuma.io/name: "flixbus-mcp"
    uptime-kuma.io/interval: "60"
    uptime-kuma.io/retries: "3"
    uptime-kuma.io/notifications: "Monitoring Bot"
    uptime-kuma.io/group: "Utilities"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: flixbus-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flixbus-mcp
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: flixbus-mcp
          image: ghcr.io/Alexxanddr/flixbus-mcp:latest
          imagePullPolicy: Always
          args:
            - -transport
            - http
            - -addr
            - :8748
          ports:
            - name: mcp
              containerPort: 8748
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: mcp
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: mcp
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: mcp
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
