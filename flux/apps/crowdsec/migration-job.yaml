apiVersion: batch/v1
kind: Job
metadata:
  name: migrate-crowdsec-to-longhorn
  namespace: system-addon
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: k3s-server
      containers:
        - name: copy-and-verify
          image: timescale/timescaledb-ha:pg18.1-ts2.25.0
          securityContext:
            runAsUser: 0
          command: ["bash", "-ceu"]
          args:
            - |
              copy_verify() {
                src=$1
                dst=$2
                label=$3
                find "$dst" -mindepth 1 -maxdepth 1 ! -name lost+found -exec rm -rf -- {} +
                (cd "$src" && find . -type f -not -path './lost+found/*' -print0 | sort -z | xargs -0 -r sha256sum) > "/tmp/$label.source.sha256"
                cp -a "$src"/. "$dst"/
                (cd "$dst" && sha256sum -c "/tmp/$label.source.sha256")
                (cd "$dst" && find . -type f -not -path './lost+found/*' -print0 | sort -z | xargs -0 -r sha256sum) > "/tmp/$label.target.sha256"
                diff -u "/tmp/$label.source.sha256" "/tmp/$label.target.sha256"
              }
              copy_verify /db-source /db-target db
              copy_verify /config-source /config-target config
              echo CROWDSEC_LONGHORN_COPY_OK
          volumeMounts:
            - name: db-source
              mountPath: /db-source
              readOnly: true
            - name: db-target
              mountPath: /db-target
            - name: config-source
              mountPath: /config-source
              readOnly: true
            - name: config-target
              mountPath: /config-target
      volumes:
        - name: db-source
          persistentVolumeClaim:
            claimName: crowdsec-db-pvc
        - name: db-target
          persistentVolumeClaim:
            claimName: crowdsec-db-longhorn
        - name: config-source
          persistentVolumeClaim:
            claimName: crowdsec-config-pvc
        - name: config-target
          persistentVolumeClaim:
            claimName: crowdsec-config-longhorn
