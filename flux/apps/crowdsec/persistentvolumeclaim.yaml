apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: crowdsec-db-longhorn
  namespace: crowdsec-system
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: longhorn-static
  volumeMode: Filesystem
  volumeName: crowdsec-db-longhorn-dedicated
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: crowdsec-config-longhorn
  namespace: crowdsec-system
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Mi
  storageClassName: longhorn-static
  volumeMode: Filesystem
  volumeName: crowdsec-config-longhorn-dedicated
