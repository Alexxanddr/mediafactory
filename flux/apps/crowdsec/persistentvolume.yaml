apiVersion: longhorn.io/v1beta2
kind: Volume
metadata:
  name: crowdsec-db-longhorn
  namespace: longhorn-system
  labels:
    backup-target: default
    recurring-job-group.longhorn.io/default: enabled
spec:
  accessMode: rwo
  backupBlockSize: "2097152"
  backupCompressionMethod: lz4
  backupTargetName: default
  dataEngine: v1
  dataLocality: disabled
  frontend: blockdev
  numberOfReplicas: 1
  revisionCounterDisabled: true
  size: "1073741824"
  staleReplicaTimeout: 2880
---
apiVersion: longhorn.io/v1beta2
kind: Volume
metadata:
  name: crowdsec-config-longhorn
  namespace: longhorn-system
  labels:
    backup-target: default
    recurring-job-group.longhorn.io/default: enabled
spec:
  accessMode: rwo
  backupBlockSize: "2097152"
  backupCompressionMethod: lz4
  backupTargetName: default
  dataEngine: v1
  dataLocality: disabled
  frontend: blockdev
  numberOfReplicas: 1
  revisionCounterDisabled: true
  size: "104857600"
  staleReplicaTimeout: 2880
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: crowdsec-db-longhorn
spec:
  accessModes:
    - ReadWriteOnce
  capacity:
    storage: 1Gi
  csi:
    driver: driver.longhorn.io
    fsType: ext4
    volumeAttributes:
      dataEngine: v1
      dataLocality: disabled
      fsType: ext4
      numberOfReplicas: "1"
      staleReplicaTimeout: "2880"
    volumeHandle: crowdsec-db-longhorn
  persistentVolumeReclaimPolicy: Retain
  storageClassName: longhorn-static
  volumeMode: Filesystem
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: crowdsec-config-longhorn
spec:
  accessModes:
    - ReadWriteOnce
  capacity:
    storage: 100Mi
  csi:
    driver: driver.longhorn.io
    fsType: ext4
    volumeAttributes:
      dataEngine: v1
      dataLocality: disabled
      fsType: ext4
      numberOfReplicas: "1"
      staleReplicaTimeout: "2880"
    volumeHandle: crowdsec-config-longhorn
  persistentVolumeReclaimPolicy: Retain
  storageClassName: longhorn-static
  volumeMode: Filesystem
