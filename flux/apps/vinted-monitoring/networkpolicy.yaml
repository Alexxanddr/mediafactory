apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vinted-monitoring
  namespace: extra-tools
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vinted-monitoring
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mcphub
        - podSelector:
            matchLabels:
              app: uptime-kuma
      ports:
        - protocol: TCP
          port: 8000
