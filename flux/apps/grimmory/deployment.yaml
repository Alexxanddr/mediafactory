apiVersion: apps/v1
kind: Deployment
metadata:
  name: grimmory
  namespace: multimedia-factory
  annotations:
    keel.sh/policy: force
    keel.sh/trigger: poll
    keel.sh/matchTag: "true"
    uptime-kuma.io/enabled: "true"
    uptime-kuma.io/type: "http"
    uptime-kuma.io/url: "http://grimmory.multimedia-factory.svc:6060"
    uptime-kuma.io/name: "grimmory"
    uptime-kuma.io/interval: "60"
    uptime-kuma.io/retries: "3"
    uptime-kuma.io/notifications: "Monitoring Bot"
    uptime-kuma.io/group: "Media & Streaming"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grimmory
  template:
    metadata:
      labels:
        app: grimmory
    spec:
      enableServiceLinks: false
      containers:
        - name: grimmory
          image: grimmory/grimmory:latest
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: grimmory-db-secret
          ports:
            - containerPort: 6060
          volumeMounts:
            - name: grimmory-data
              mountPath: /app/data
            - name: grimmory-books
              mountPath: /books
            - name: grimmory-bookdrop
              mountPath: /bookdrop
          livenessProbe:
            exec:
              command:
                - wget
                - -q
                - -O
                - '-'
                - http://localhost:6060/api/v1/healthcheck
            initialDelaySeconds: 60
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            exec:
              command:
                - wget
                - -q
                - -O
                - '-'
                - http://localhost:6060/api/v1/healthcheck
            initialDelaySeconds: 60
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 5
      volumes:
        - name: grimmory-data
          persistentVolumeClaim:
            claimName: grimmory-data
        - name: grimmory-books
          persistentVolumeClaim:
            claimName: grimmory-books
        - name: grimmory-bookdrop
          persistentVolumeClaim:
            claimName: grimmory-bookdrop
      initContainers:
        - name: wait-for-db
          image: busybox:1.28
          command: ['sh', '-c', 'until nc -z mariadb.database.svc.cluster.local 3306; do echo waiting for db; sleep 2; done;']
