apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grimmory-books
  namespace: multimedia-factory
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 100Gi
  storageClassName: local-path
  volumeMode: Filesystem
  volumeName: grimmory-books
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grimmory-data-longhorn
  namespace: multimedia-factory
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: longhorn-static
  volumeMode: Filesystem
  volumeName: grimmory-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: migration-bookdrop
  namespace: multimedia-factory
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
  storageClassName: longhorn-static
  volumeMode: Filesystem
  volumeName: migration-bookdrop
