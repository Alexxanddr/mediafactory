---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fileflows-media
  namespace: multimedia-factory
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 100Gi
  storageClassName: local-path
  volumeMode: Filesystem
  volumeName: fileflows-media
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fileflows-common-longhorn
  namespace: multimedia-factory
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: longhorn-static
  volumeMode: Filesystem
  volumeName: fileflows-common
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fileflows-data-longhorn
  namespace: multimedia-factory
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: longhorn-static
  volumeMode: Filesystem
  volumeName: fileflows-data
