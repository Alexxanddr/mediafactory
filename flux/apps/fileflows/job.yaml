apiVersion: batch/v1
kind: Job
metadata:
  name: copy-fileflows
  namespace: multimedia-factory
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: copy
          image: python:3.13-alpine
          command:
            - /bin/sh
            - -ec
            - |
              copy_and_check() {
                source="$1"
                target="$2"
                if [ -d "$target/lost+found" ]; then
                  [ -z "$(find "$target/lost+found" -mindepth 1 -print -quit)" ]
                  rmdir "$target/lost+found"
                fi
                [ -z "$(find "$target" -mindepth 1 -print -quit)" ]
                cp -a "$source"/. "$target"/
                sync
                (cd "$source" && find . -type f -print0 | sort -z | xargs -0 sha256sum) > /tmp/source.sha256
                (cd "$target" && find . -type f -print0 | sort -z | xargs -0 sha256sum) > /tmp/target.sha256
                diff -u /tmp/source.sha256 /tmp/target.sha256
              }
              copy_and_check /source-common /target-common
              echo FILEFLOWS_COMMON_SHA256_OK
              copy_and_check /source-data /target-data
              echo FILEFLOWS_DATA_SHA256_OK
              python3 - <<'PYSQL'
              import os, sqlite3
              path="/target-data/Data/FileFlows.sqlite"
              if not os.path.isfile(path):
                  raise SystemExit(f"SQLite database is missing: {path}")
              with sqlite3.connect(f"file:{path}?mode=ro", uri=True) as db:
                  result=db.execute("PRAGMA integrity_check").fetchone()[0]
              if result!="ok":
                  raise SystemExit(f"SQLite integrity failure: {path}: {result}")
              print(f"SQLITE_INTEGRITY_OK {path}")
              PYSQL
          volumeMounts:
            - name: source-common
              mountPath: /source-common
              readOnly: true
            - name: target-common
              mountPath: /target-common
            - name: source-data
              mountPath: /source-data
              readOnly: true
            - name: target-data
              mountPath: /target-data
      volumes:
        - name: source-common
          persistentVolumeClaim:
            claimName: fileflows-common
            readOnly: true
        - name: target-common
          persistentVolumeClaim:
            claimName: migration-fileflows-common
        - name: source-data
          persistentVolumeClaim:
            claimName: fileflows-data
            readOnly: true
        - name: target-data
          persistentVolumeClaim:
            claimName: migration-fileflows-data
