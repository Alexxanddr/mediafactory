apiVersion: apps/v1
kind: Deployment
metadata:
  name: pihole-mcp
  namespace: extra-tools
  annotations:
    keel.sh/policy: force
    keel.sh/trigger: poll
    keel.sh/matchTag: "true"
    uptime-kuma.io/enabled: "true"
    uptime-kuma.io/type: "tcp"
    uptime-kuma.io/url: "pihole-mcp.extra-tools.svc"
    uptime-kuma.io/port: "8080"
    uptime-kuma.io/name: "pihole-mcp"
    uptime-kuma.io/interval: "60"
    uptime-kuma.io/retries: "3"
    uptime-kuma.io/notifications: "Monitoring Bot"
    uptime-kuma.io/group: "Network & Connectivity"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pihole-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pihole-mcp
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pihole-mcp
          image: ghcr.io/hexamatic/pihole-mcp:latest
          imagePullPolicy: Always
          args: ["-transport", "http", "-address", "0.0.0.0:8080"]
          env:
            - name: PIHOLE_URL
              value: http://pihole-web.extra-tools.svc
            - name: PIHOLE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pihole-credentials
                  key: password
            - name: PIHOLE_READ_ONLY
              value: "true"
            - name: PIHOLE_ALLOWED_ORIGINS
              value: pihole-mcp.extra-tools.svc,pihole-mcp.extra-tools.svc:8080,pihole-mcp.extra-tools.svc.cluster.local,pihole-mcp.extra-tools.svc.cluster.local:8080
            - name: PIHOLE_HTTP_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: pihole-credentials
                  key: password
            - name: TZ
              value: Europe/Rome
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
          livenessProbe:
            tcpSocket:
              port: http
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
