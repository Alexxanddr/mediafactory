apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sparkyfitness
  namespace: extra-tools
spec:
  interval: 30m

  chartRef:
    kind: OCIRepository
    name: sparkyfitness
    namespace: flux-system

  install:
    createNamespace: false
    remediation:
      retries: 3

  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true

  values:
    postgresql:
      enabled: false

    externalDatabase:
      host: postgres-rw.database.svc.cluster.local
      port: 5432
      database: sparkyfitness
      auth:
        existingSecret: sparkyfitness-secrets

    server:
      secrets:
        existingSecret: sparkyfitness-secrets

      appDatabase:
        existingSecret: sparkyfitness-secrets

      envFrom:
        - secretRef:
            name: sparkyfitness-secrets

    ingress:
      enabled: false

    httpRoute:
      enabled: false