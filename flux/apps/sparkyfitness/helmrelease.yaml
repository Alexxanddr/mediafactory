apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sparkyfitness
  namespace: extra-tools
spec:
  interval: 30m

  chartRef:
    kind: OCIRepository
    name: sparkyfitness
    namespace: flux-system

  install:
    createNamespace: false
    remediation:
      retries: 3

  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true

  values:
    postgresql:
      enabled: false

    externalDatabase:
      host: postgres-rw.database.svc.cluster.local
      port: 5432
      database: sparkyfitness
      auth:
        existingSecret: sparkyfitness-secrets

    server:
      secrets:
        existingSecret: sparkyfitness-secrets

      appDatabase:
        existingSecret: sparkyfitness-secrets

      extraEnv:
        - name: SPARKY_FITNESS_FRONTEND_URL
          valueFrom:
            secretKeyRef:
              name: sparkyfitness-secrets
              key: SPARKY_FITNESS_FRONTEND_URL

        - name: BETTER_AUTH_URL
          valueFrom:
            secretKeyRef:
              name: sparkyfitness-secrets
              key: BETTER_AUTH_URL

        - name: SPARKY_FITNESS_EXTRA_TRUSTED_ORIGINS
          valueFrom:
            secretKeyRef:
              name: sparkyfitness-secrets
              key: SPARKY_FITNESS_EXTRA_TRUSTED_ORIGINS

    ingress:
      enabled: false

    httpRoute:
      enabled: false