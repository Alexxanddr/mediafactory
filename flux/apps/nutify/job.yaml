apiVersion: batch/v1
kind: Job
metadata:
  name: verify-nutify-data
  namespace: extra-tools
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: verify
          image: python:3.13-alpine
          command: ["/bin/sh", "-ec"]
          args:
            - |
              set -eu
              (cd /source && find . -type f -exec sha256sum {} + | sort) > /tmp/source.sha
              (cd /target && find . -type f -exec sha256sum {} + | sort) > /tmp/target.sha
              diff -u /tmp/source.sha /tmp/target.sha
              echo COPY_SHA256_OK
              python3 -c 'import sqlite3,sys; p=sys.argv[1]; c=sqlite3.connect("file:"+p+"?mode=ro",uri=True); r=c.execute("PRAGMA integrity_check").fetchone()[0]; c.close(); print("SQLITE_INTEGRITY_OK",p); sys.exit(r != "ok")' /target/instance/nutify.db.sqlite
          volumeMounts:
            - name: source
              mountPath: /source
              readOnly: true
            - name: target
              mountPath: /target
              readOnly: true
      volumes:
        - name: source
          persistentVolumeClaim:
            claimName: nutify-data
            readOnly: true
        - name: target
          persistentVolumeClaim:
            claimName: migration-nutify-data
            readOnly: true
