
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nutify-data
  namespace: extra-tools
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 100Gi
  storageClassName: local-path
  volumeMode: Filesystem
  volumeName: nutify-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: migration-nutify-data
  namespace: extra-tools
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 3Gi
  storageClassName: longhorn-static
  volumeMode: Filesystem
  volumeName: migration-nutify-data
