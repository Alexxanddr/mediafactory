apiVersion: v1
kind: Pod
metadata:
  name: mergerfs-test
  namespace: mergerfs
spec:
  nodeSelector:
    kubernetes.io/hostname: k3s-server
  containers:
    - name: mergerfs
      image: slink42/mergerfs:latest
      imagePullPolicy: Always
      command: ["/bin/sh", "-c"]
      args:
        - exec mergerfs -f -o allow_other,use_ino,ro /mnt/hd1:/mnt/hd2 /mnt/merged
      securityContext:
        privileged: true
      volumeMounts:
        - name: fuse
          mountPath: /dev/fuse
        - name: hd1
          mountPath: /mnt/hd1
          readOnly: true
        - name: hd2
          mountPath: /mnt/hd2
          readOnly: true
        - name: merged
          mountPath: /mnt/merged
          mountPropagation: Bidirectional
  volumes:
    - name: fuse
      hostPath:
        path: /dev/fuse
        type: CharDevice
    - name: hd1
      hostPath:
        path: /mnt/hd1
        type: Directory
    - name: hd2
      hostPath:
        path: /mnt/hd2
        type: Directory
    - name: merged
      hostPath:
        path: /var/mnt/mergerfs-flux-test
        type: DirectoryOrCreate
