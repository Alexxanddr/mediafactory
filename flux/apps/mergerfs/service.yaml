apiVersion: v1
kind: Service
metadata:
  name: mergerfs
  namespace: mergerfs
spec:
  clusterIP: None
  selector:
    app: mergerfs
---
apiVersion: v1
kind: Service
metadata:
  name: nfs-ganesha
  namespace: mergerfs
spec:
  type: ClusterIP
  selector:
    app: nfs-ganesha
  ports:
    - name: nfs
      port: 2049
      protocol: TCP
      targetPort: nfs
