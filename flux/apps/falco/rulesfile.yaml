apiVersion: artifact.falcosecurity.dev/v1alpha1
kind: Rulesfile
metadata:
  name: falco-rules
  namespace: falco-system
  labels:
    app.kubernetes.io/managed-by: falco-operator
spec:
  ociArtifact:
    image:
      repository: falcosecurity/rules/falco-rules
      tag: latest
    registry:
      name: ghcr.io
  priority: 50
---
apiVersion: artifact.falcosecurity.dev/v1alpha1
kind: Rulesfile
metadata:
  name: falco-local-rules
  namespace: falco-system
  labels:
    app.kubernetes.io/managed-by: falco-operator
spec:
  inlineRules:
    - macro: known_drop_and_execute_activities
      condition: >
        or (
          container.image.repository = "docker.io/dartsteven/nutify"
          and container.image.tag = "latest-amd64"
          and container.name = "nutify"
          and k8s.ns.name in ("nutify", "extra-tools")
          and user.uid = 0
          and proc.tty = 0
          and (
            (
              proc.name = "upsc"
              and proc.exepath = "/usr/bin/upsc"
              and proc.cmdline in (
                "upsc ups@127.0.0.1",
                "upsc ups@localhost",
                "upsc ups@localhost ups.status"
              )
            )
            or (
              proc.name = "upsrw"
              and proc.exepath = "/usr/bin/upsrw"
              and proc.cmdline startswith "upsrw -u "
              and proc.cmdline endswith " ups@localhost"
            )
            or (
              proc.name = "upscmd"
              and proc.exepath = "/usr/bin/upscmd"
              and proc.cmdline startswith "upscmd -u "
              and proc.cmdline endswith " -l ups@localhost"
            )
          )
        )
        or (
          container.image.repository = "docker.io/pihole/pihole"
          and container.image.tag = "latest"
          and container.name = "pihole"
          and k8s.ns.name in ("pihole", "extra-tools")
          and user.uid in (0, 1000)
          and proc.name = "pihole-FTL"
          and proc.exepath = "/usr/bin/pihole-FTL"
          and (
            proc.sname in ("start.sh", "crond")
            or (
              proc.sname = ""
              and proc.pname = "bash"
              and proc.aname[2] = "bash"
              and proc.cmdline in (
                "pihole-FTL --config -q files.log.dnsmasq",
                "pihole-FTL --config -q files.log.ftl",
                "pihole-FTL --config -q files.log.webserver",
                "pihole-FTL --config -q webserver.paths.webroot",
                "pihole-FTL --config -q webserver.paths.webhome",
                "pihole-FTL version",
                "pihole-FTL branch",
                "pihole-FTL --hash"
              )
            )
          )
          and proc.pname in ("bash", "start.sh")
          and proc.cwd in ("/", "/root/")
          and proc.cmdline startswith "pihole-FTL "
          and proc.tty = 0
        )
        or (
          (
            (
              container.image.repository = "ghcr.io/flaresolverr/flaresolverr"
              and container.image.tag = "latest"
              and container.name = "flaresolverr"
              and k8s.ns.name = "multimedia-factory"
            )
            or (
              not container.image.repository exists
              and k8smeta.ns.name = "multimedia-factory"
              and k8smeta.pod.name startswith "flaresolverr-"
              and k8smeta.pod.label[app] = "flaresolverr"
            )
          )
          and user.uid = 1000
          and proc.name = "chromedriver"
          and proc.exepath = "/app/chromedriver"
          and proc.cmdline startswith "chromedriver --port="
          and proc.tty = 0
        )
        or (
          container.image.repository = "docker.io/revenz/fileflows"
          and container.image.tag = "latest"
          and container.name = "fileflows-node"
          and k8s.ns.name in ("fileflows-node", "multimedia-factory")
          and user.uid = 1000
          and proc.name = "ffmpeg"
          and proc.exe = "/usr/local/bin/ffmpeg"
          and proc.exepath = "/usr/lib/jellyfin-ffmpeg/ffmpeg"
          and proc.pname = "dotnet"
          and proc.aname[2] in ("dotnet", ".NET TP Worker")
          and proc.cwd = "/app/FlowRunner/"
          and proc.cmdline startswith "ffmpeg "
          and proc.tty = 0
        )
        or (
          container.image.repository = "docker.io/revenz/fileflows"
          and container.image.tag = "latest"
          and (
            (
              container.name = "fileflows"
              and k8s.ns.name = "multimedia-factory"
            )
            or (
              container.name = "fileflows-node"
              and k8s.ns.name in ("fileflows-node", "multimedia-factory")
            )
          )
          and user.uid = 0
          and proc.sname = "dpkg"
          and proc.cwd = "/"
          and proc.tty = 34816
          and (
            (
              proc.name = "dbus-uuidgen"
              and proc.exepath = "/usr/bin/dbus-uuidgen"
              and proc.pname = "dbus-daemon.pos"
              and proc.cmdline = "dbus-uuidgen --ensure"
            )
            or (
              proc.name = "mkfontscale"
              and proc.exepath = "/usr/bin/mkfontscale"
              and proc.pname = "update-fonts-di"
              and proc.aname[2] = "fonts-urw-base3"
              and proc.cmdline = "mkfontscale -b -s -l -e /usr/share/fonts/X11/encodings -e /usr/share/fonts/X11/encodings/large /usr/share/fonts/X11/Type1"
            )
          )
        )
      override:
        condition: append
    - macro: known_memfd_execution_processes
      condition: >
        or (
          user.uid = 0
          and proc.pname in ("nvidia-cdi-hook", "nvidia-ctk")
          and proc.sname = "runc:[1:CHILD]"
          and proc.aname[2] = "runc:[1:CHILD]"
          and proc.cwd = "/"
          and proc.exepath startswith "memfd:runc_cloned:"
          and proc.exepath endswith "ldconfig"
          and proc.cmdline in (
            "11 -f /etc/ld.so.conf -C /etc/ld.so.cache",
            "12 -f /etc/ld.so.conf -C /etc/ld.so.cache",
            "memfd:runc_clon -f /etc/ld.so.conf -C /etc/ld.so.cache"
          )
          and proc.tty = 0
        )
      override:
        condition: append
    - macro: user_known_stand_streams_redirect_activities
      condition: >
        or (
          container.image.repository = "ghcr.io/qdm12/gluetun"
          and container.image.tag = "latest"
          and container.name = "gluetun"
          and k8s.ns.name = "multimedia-factory"
          and user.uid = 0
          and proc.name = "ping"
          and proc.exepath = "/bin/busybox"
          and proc.cmdline startswith "ping -c 1 "
          and proc.tty = 0
        )
        or (
          k8s.ns.name = "longhorn-system"
          and container.image.tag = "v1.13.0"
          and user.uid = 0
          and proc.tty = 0
          and evt.type = "dup3"
          and (
            (
              container.image.repository = "docker.io/longhornio/longhorn-manager"
              and container.name = "longhorn-manager"
              and proc.name = "longhorn-manage"
              and proc.cmdline startswith "longhorn-manage -d daemon --engine-image "
              and fd.rnet = "10.244.0.0/16"
              and fd.rport = 8501
            )
            or (
              container.image.repository = "docker.io/longhornio/longhorn-instance-manager"
              and container.name = "instance-manager"
              and proc.name = "longhorn-instan"
              and proc.cmdline = "longhorn-instan --debug daemon --listen :8500"
              and (
                (fd.lport in (8501, 8502) and fd.cnet = "10.244.0.0/16")
                or (fd.lport = 8502 and fd.cip = "::1")
                or (fd.rport >= 10000 and fd.rport <= 30000 and fd.rnet = "10.244.0.0/16")
              )
            )
          )
        )
      override:
        condition: append
    - macro: user_known_contact_k8s_api_server_activities
      condition: >
        or (
          (
            container.image.repository = "ghcr.io/gethomepage/homepage"
            and container.image.tag = "latest"
            and container.name = "homepage"
            and k8s.ns.name = "multimedia-factory"
            and user.uid = 0
            and proc.exepath = "/usr/local/bin/node"
          )
          or (
            container.image.repository = "ghcr.io/mariadb-operator/mariadb-operator"
            and container.name in ("controller", "cert-controller")
            and k8s.ns.name = "database"
            and user.uid = 65532
            and proc.exepath = "/usr/bin/mariadb-operator"
          )
          or (
            container.image.repository = "ghcr.io/alexxanddr/update-unifi-pbr"
            and container.image.tag = "latest"
            and container.name = "sync"
            and k8s.ns.name = "system-addon"
            and user.uid = 65532
            and proc.exepath startswith "/usr/bin/python3"
            and proc.cmdline = "python3 -m app.main"
          )
          or (
            container.image.repository = "ghcr.io/alexxanddr/uptime-kuma-operator"
            and container.image.tag in ("1.2.0", "1.2.1")
            and container.name = "operator"
            and k8s.ns.name = "extra-tools"
            and user.uid = 10001
            and proc.name = "kopf"
            and proc.exepath startswith "/usr/local/bin/python3"
            and proc.cmdline = "kopf /usr/local/bin/kopf run --all-namespaces --standalone --liveness=http://0.0.0.0:8080/healthz operator.py"
            and proc.tty = 0
          )
          or (
            container.image.repository = "ghcr.io/alexxanddr/stale-file-controller-k8s"
            and container.image.tag = "latest"
            and container.name = "controller"
            and k8s.ns.name = "storage-recovery"
            and user.uid = 65532
            and proc.name = "stale-file-cont"
            and proc.exepath = "/usr/local/bin/python3.13"
            and proc.cmdline = "stale-file-cont /usr/local/bin/stale-file-controller"
            and proc.tty = 0
          )
          or (
            container.image.repository = "docker.io/library/python"
            and container.image.tag = "latest"
            and container.name = "retention"
            and k8s.ns.name = "database"
            and user.uid = 65532
            and proc.name = "python"
            and proc.exepath startswith "/usr/local/bin/python3"
            and proc.cmdline = "python /scripts/retention.py"
            and proc.tty = 0
          )
        )
      override:
        condition: append
    - macro: postgres_running_cnpg
      condition: >
        or (
          container.image.repository = "ghcr.io/cloudnative-pg/postgresql"
          and container.name in ("postgres", "pgbasebackup")
          and k8s.ns.name = "database"
          and user.uid = 26
          and proc.name = "sh"
          and proc.exepath = "/usr/bin/dash"
          and proc.pname = "postgres"
          and proc.cmdline startswith
          "sh -c -- /controller/manager wal-archive --log-destination /controller/log/postgres.json pg_wal/"
        )
      override:
        condition: append
    - macro: allowed_clear_log_files
      condition: >
        or (
          container.image.repository = "docker.io/revenz/fileflows"
          and container.image.tag = "latest"
          and container.name in ("fileflows", "fileflows-node")
          and k8s.ns.name = "multimedia-factory"
          and user.uid = 0
          and proc.name = "fontconfig.post"
          and proc.exepath = "/usr/bin/dash"
          and proc.pname = "dpkg"
          and proc.cmdline = "fontconfig.post /var/lib/dpkg/info/fontconfig.postinst triggered /usr/share/fonts /usr/share/ghostscript/fonts"
          and fd.name = "/var/log/fontconfig.log"
        )
      override:
        condition: append
    - rule: Create Hardlink Over Sensitive Files
      condition: >
        and not (
          user.uid = 0
          and proc.tty = 0
          and proc.name = "adduser"
          and proc.exepath = "/bin/busybox"
          and evt.arg.oldpath = "/etc/shadow"
          and evt.arg.newpath = "/etc/shadow-"
          and container.image.tag = "latest"
          and (
            (
              container.image.repository = "docker.io/trigus42/qbittorrentvpn"
              and container.name = "qbittorrent-wg"
              and k8s.ns.name = "qbittorrent-wg"
              and proc.pname = "environment.sh"
              and proc.cmdline = "adduser -D -u 1000 qbittorrent"
            )
            or (
              container.image.repository = "docker.io/grimmory/grimmory"
              and container.name = "grimmory"
              and k8s.ns.name = "multimedia-factory"
              and proc.pname = "entrypoint.sh"
              and proc.cmdline = "adduser -u 1000 -G booklore -S -D booklore"
            )
            or (
              container.image.repository = "ghcr.io/crazy-max/samba"
              and container.name = "samba"
              and k8s.ns.name = "mergerfs"
              and proc.pname = "bash"
              and proc.cmdline in (
                "adduser -u 1000 -G mediafactory mediafactory -SHD",
                "adduser -u 1001 -G timemachine timemachine -SHD"
              )
            )
            or (
              container.image.repository = "ghcr.io/anibridge/anibridge"
              and container.name = "anibridge"
              and k8s.ns.name = "multimedia-factory"
              and proc.pname = "sh"
              and proc.cmdline = "adduser -u 1000 -G abc -s /bin/sh -D abc"
            )
          )
        )
      override:
        condition: append
    - rule: Packet socket created in container
      condition: >
        and not (
          container.image.repository = "quay.io/metallb/speaker"
          and container.image.tag = "v0.16.2"
          and container.name = "speaker"
          and k8s.ns.name = "metallb-system"
          and user.uid = 0
          and proc.name = "speaker"
          and proc.exepath = "/speaker"
          and proc.cmdline = "speaker --port=9120 --health-probe-port=17472 --log-level=info"
          and proc.tty = 0
        )
      override:
        condition: append
    - rule: Run shell untrusted
      condition: >
        and not (
          container.image.repository = "registry-1.docker.io/bitnami/redis"
          and container.image.tag = "latest"
          and container.name = "redis"
          and k8s.ns.name = "database"
          and user.uid = 1001
          and proc.name = "bash"
          and proc.exepath = "/usr/bin/bash"
          and proc.tty = 0
          and proc.cmdline in (
            "bash -ec /health/ping_readiness_local.sh 1",
            "bash -ec /health/ping_liveness_local.sh 5"
          )
        )
      override:
        condition: append
  priority: 60
