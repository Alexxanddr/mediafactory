apiVersion: batch/v1
kind: Job
metadata:
  name: copy-fileflows-node-longhorn
  namespace: multimedia-factory
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 14400
  template:
    spec:
      restartPolicy: Never
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: copy
          image: python:3.13-alpine
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
          command:
            - /bin/sh
            - -ec
            - |
              source=/source/fileflows-node-common
              target=/target/fileflows-node-common
              if [ -d "$target/lost+found" ]; then
                [ -z "$(find "$target/lost+found" -mindepth 1 -print -quit)" ]
                rmdir "$target/lost+found"
              fi
              [ -z "$(find "$target" -mindepth 1 -print -quit)" ]
              cp -a "$source/." "$target/"
              sync
              (cd "$source" && find . -type f -print0 | sort -z | xargs -0 sha256sum) > /tmp/fileflows-node-common-source.sha256
              (cd "$target" && find . -type f -print0 | sort -z | xargs -0 sha256sum) > /tmp/fileflows-node-common-target.sha256
              diff -u /tmp/fileflows-node-common-source.sha256 /tmp/fileflows-node-common-target.sha256
              echo COPY_SHA256_OK fileflows-node-common
              source=/source/fileflows-node-data
              target=/target/fileflows-node-data
              if [ -d "$target/lost+found" ]; then
                [ -z "$(find "$target/lost+found" -mindepth 1 -print -quit)" ]
                rmdir "$target/lost+found"
              fi
              [ -z "$(find "$target" -mindepth 1 -print -quit)" ]
              cp -a "$source/." "$target/"
              sync
              (cd "$source" && find . -type f -print0 | sort -z | xargs -0 sha256sum) > /tmp/fileflows-node-data-source.sha256
              (cd "$target" && find . -type f -print0 | sort -z | xargs -0 sha256sum) > /tmp/fileflows-node-data-target.sha256
              diff -u /tmp/fileflows-node-data-source.sha256 /tmp/fileflows-node-data-target.sha256
              echo COPY_SHA256_OK fileflows-node-data
              source=/source/fileflows-node-temp
              target=/target/fileflows-node-temp
              if [ -d "$target/lost+found" ]; then
                [ -z "$(find "$target/lost+found" -mindepth 1 -print -quit)" ]
                rmdir "$target/lost+found"
              fi
              [ -z "$(find "$target" -mindepth 1 -print -quit)" ]
              cp -a "$source/." "$target/"
              sync
              (cd "$source" && find . -type f -print0 | sort -z | xargs -0 sha256sum) > /tmp/fileflows-node-temp-source.sha256
              (cd "$target" && find . -type f -print0 | sort -z | xargs -0 sha256sum) > /tmp/fileflows-node-temp-target.sha256
              diff -u /tmp/fileflows-node-temp-source.sha256 /tmp/fileflows-node-temp-target.sha256
              echo COPY_SHA256_OK fileflows-node-temp
              python3 - <<'PYSQL'
              import glob, sqlite3
              roots = [
                  "/target/fileflows-node-data",
              ]
              paths = []
              for root in roots:
                  for pattern in ("**/*.db", "**/*.sqlite", "**/*.sqlite3"):
                      paths.extend(glob.glob(root + "/" + pattern, recursive=True))
              for path in sorted(set(paths)):
                  with sqlite3.connect("file:" + path + "?mode=ro", uri=True) as db:
                      result = db.execute("PRAGMA integrity_check").fetchone()[0]
                  if result != "ok":
                      raise SystemExit(f"SQLite integrity failure: {path}: {result}")
                  print(f"SQLITE_INTEGRITY_OK {path}")
              if not paths:
                  print("NO_SQLITE_DATABASES_IN_COPY")
              PYSQL
          volumeMounts:
            - name: source-fileflows-node-common
              mountPath: /source/fileflows-node-common
              readOnly: true
            - name: target-fileflows-node-common
              mountPath: /target/fileflows-node-common
            - name: source-fileflows-node-data
              mountPath: /source/fileflows-node-data
              readOnly: true
            - name: target-fileflows-node-data
              mountPath: /target/fileflows-node-data
            - name: source-fileflows-node-temp
              mountPath: /source/fileflows-node-temp
              readOnly: true
            - name: target-fileflows-node-temp
              mountPath: /target/fileflows-node-temp
      volumes:
        - name: source-fileflows-node-common
          persistentVolumeClaim:
            claimName: fileflows-node-common
            readOnly: true
        - name: target-fileflows-node-common
          persistentVolumeClaim:
            claimName: migration-fileflows-node-common
        - name: source-fileflows-node-data
          persistentVolumeClaim:
            claimName: fileflows-node-data
            readOnly: true
        - name: target-fileflows-node-data
          persistentVolumeClaim:
            claimName: migration-fileflows-node-data
        - name: source-fileflows-node-temp
          persistentVolumeClaim:
            claimName: fileflows-node-temp
            readOnly: true
        - name: target-fileflows-node-temp
          persistentVolumeClaim:
            claimName: migration-fileflows-node-temp
