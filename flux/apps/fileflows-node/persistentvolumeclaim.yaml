apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fileflows-node-common-longhorn
  namespace: multimedia-factory
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
  storageClassName: longhorn-static
  volumeMode: Filesystem
  volumeName: fileflows-node-common
---
