apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fileflows-node-common-longhorn
  namespace: fileflows-node
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: longhorn-static
  volumeMode: Filesystem
  volumeName: fileflows-node-common-dedicated
---
