---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: your-spotify-server
  namespace: extra-tools
  annotations:
    keel.sh/policy: force
    keel.sh/trigger: poll
    keel.sh/matchTag: "true"
    uptime-kuma.io/enabled: "true"
    uptime-kuma.io/type: "http"
    uptime-kuma.io/url: "http://your-spotify-server.extra-tools.svc:8080"
    uptime-kuma.io/name: "your-spotify-server"
    uptime-kuma.io/interval: "60"
    uptime-kuma.io/retries: "3"
    uptime-kuma.io/notifications: "Monitoring Bot"
    uptime-kuma.io/group: "Media Tools"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: your-spotify-server
  template:
    metadata:
      labels:
        app: your-spotify-server
    spec:
      containers:
        - name: server
          image: yooooomi/your_spotify_server
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: spotify-secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: your-spotify-web
  namespace: extra-tools
  annotations:
    keel.sh/policy: force
    keel.sh/trigger: poll
    keel.sh/matchTag: "true"
    uptime-kuma.io/enabled: "true"
    uptime-kuma.io/type: "http"
    uptime-kuma.io/url: "http://your-spotify-web.extra-tools.svc:3000"
    uptime-kuma.io/name: "your-spotify-web"
    uptime-kuma.io/interval: "60"
    uptime-kuma.io/retries: "3"
    uptime-kuma.io/notifications: "Monitoring Bot"
    uptime-kuma.io/group: "Media Tools"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: your-spotify-web
  template:
    metadata:
      labels:
        app: your-spotify-web
    spec:
      containers:
        - name: web
          image: yooooomi/your_spotify_client
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: API_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: spotify-secret
                  key: API_ENDPOINT
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
  namespace: extra-tools
  annotations:
    keel.sh/policy: force
    keel.sh/trigger: poll
    keel.sh/matchTag: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      containers:
        - name: mongo
          image: mongo:6
          ports:
            - containerPort: 27017
          volumeMounts:
            - mountPath: /data/db
              name: mongo-storage
      volumes:
        - name: mongo-storage
          persistentVolumeClaim:
            claimName: spotify-mongo
