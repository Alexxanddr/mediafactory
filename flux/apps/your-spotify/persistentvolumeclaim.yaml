apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: spotify-mongo
  namespace: extra-tools
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
  storageClassName: local-path
  volumeMode: Filesystem
  volumeName: spotify-mongo
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: migration-spotify-mongo
  namespace: extra-tools
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: longhorn-static
  volumeMode: Filesystem
  volumeName: migration-spotify-mongo
