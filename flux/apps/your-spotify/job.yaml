apiVersion: batch/v1
kind: Job
metadata:
  name: migrate-spotify-mongo-to-longhorn
  namespace: extra-tools
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: k3s-server
      containers:
        - name: copy-and-verify
          image: mongo:6
          command: ["bash", "-ceu"]
          args:
            - |
              src=/source
              dst=/target
              cd "$src"
              find . -type f -not -path './lost+found/*' -print0 | sort -z | xargs -0 sha256sum > /tmp/source.sha256
              cp -a "$src"/. "$dst"/
              cd "$dst"
              sha256sum -c /tmp/source.sha256
              find . -type f -not -path './lost+found/*' -print0 | sort -z | xargs -0 sha256sum > /tmp/target.sha256
              diff -u /tmp/source.sha256 /tmp/target.sha256
              echo 'MONGO_COPY_SHA256_OK'
          volumeMounts:
            - name: source
              mountPath: /source
              readOnly: true
            - name: target
              mountPath: /target
      volumes:
        - name: source
          hostPath:
            path: /var/lib/rancher/k3s/storage/your_spotify
            type: Directory
        - name: target
          persistentVolumeClaim:
            claimName: migration-spotify-mongo
