apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dispatcharr-data-longhorn
  namespace: multimedia-factory
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: longhorn-static
  volumeMode: Filesystem
  volumeName: dispatcharr-data-longhorn
