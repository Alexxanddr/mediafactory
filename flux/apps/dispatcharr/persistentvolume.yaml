apiVersion: v1
kind: PersistentVolume
metadata:
  finalizers:
  - kubernetes.io/pv-protection
  name: dispatcharr-data
spec:
  accessModes:
  - ReadWriteMany
  capacity:
    storage: 100Gi
  local:
    path: /var/lib/rancher/k3s/storage/dispatcharr/data
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - k3s-server
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-path
  volumeMode: Filesystem
---
apiVersion: longhorn.io/v1beta2
kind: Volume
metadata:
  name: dispatcharr-data-longhorn
  namespace: longhorn-system
  labels:
    backup-target: default
    recurring-job-group.longhorn.io/default: enabled
spec:
  accessMode: rwo
  backupBlockSize: "2097152"
  backupCompressionMethod: lz4
  backupTargetName: default
  dataEngine: v1
  dataLocality: disabled
  frontend: blockdev
  numberOfReplicas: 1
  revisionCounterDisabled: true
  size: "2147483648"
  staleReplicaTimeout: 2880
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: dispatcharr-data-longhorn
spec:
  accessModes:
    - ReadWriteOnce
  capacity:
    storage: 2Gi
  csi:
    driver: driver.longhorn.io
    fsType: ext4
    volumeAttributes:
      dataEngine: v1
      dataLocality: disabled
      fsType: ext4
      numberOfReplicas: "1"
      staleReplicaTimeout: "2880"
    volumeHandle: dispatcharr-data-longhorn
  persistentVolumeReclaimPolicy: Retain
  storageClassName: longhorn-static
  volumeMode: Filesystem
