---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dispatcharr-redis
  namespace: multimedia-factory
  annotations:
    keel.sh/policy: force
    keel.sh/trigger: poll
    keel.sh/matchTag: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dispatcharr-redis
  template:
    metadata:
      labels:
        app: dispatcharr-redis
    spec:
      containers:
        - name: redis
          image: redis:latest
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: dispatcharr-redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dispatcharr-web
  namespace: multimedia-factory
  annotations:
    keel.sh/policy: force
    keel.sh/trigger: poll
    keel.sh/matchTag: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dispatcharr-web
  template:
    metadata:
      labels:
        app: dispatcharr-web
    spec:
      containers:
        - name: web
          image: ghcr.io/dispatcharr/dispatcharr:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 9191
          envFrom:
            - secretRef:
                name: dispatcharr-secrets
          env:
            - name: DISPATCHARR_ENV
              value: modular
            - name: DISPATCHARR_LOG_LEVEL
              value: info
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /
              port: 9191
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: dispatcharr-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery
  namespace: multimedia-factory
  annotations:
    keel.sh/policy: force
    keel.sh/trigger: poll
    keel.sh/matchTag: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: celery
  template:
    metadata:
      labels:
        app: celery
    spec:
      containers:
        - name: celery
          image: ghcr.io/dispatcharr/dispatcharr:latest
          imagePullPolicy: Always
          command: ["/app/docker/entrypoint.celery.sh"]
          envFrom:
            - secretRef:
                name: dispatcharr-secrets
          env:
            - name: DISPATCHARR_ENV
              value: modular
            - name: DISPATCHARR_PORT
              value: "9191"
            # - name: REDIS_HOST
            #   value: dispatcharr-redis
            - name: DISPATCHARR_LOG_LEVEL
              value: info
            - name: DJANGO_SETTINGS_MODULE
              value: dispatcharr.settings
            - name: PYTHONUNBUFFERED
              value: "1"
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: dispatcharr-data
