apiVersion: apps/v1
kind: Deployment
metadata:
  name: dispatcharr-web
  namespace: multimedia-factory
  annotations:
    keel.sh/policy: force
    keel.sh/trigger: poll
    keel.sh/matchTag: "true"
    uptime-kuma.io/enabled: "true"
    uptime-kuma.io/type: "http"
    uptime-kuma.io/url: "http://dispatcharr-web.multimedia-factory.svc:9191"
    uptime-kuma.io/name: "dispatcharr-web"
    uptime-kuma.io/interval: "60"
    uptime-kuma.io/retries: "3"
    uptime-kuma.io/notifications: "Monitoring Bot"
    uptime-kuma.io/group: "Media Acquisition"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dispatcharr-web
  template:
    metadata:
      labels:
        app: dispatcharr-web
    spec:
      containers:
        - name: web
          image: ghcr.io/dispatcharr/dispatcharr:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 9191
          envFrom:
            - secretRef:
                name: dispatcharr-secrets
          env:
            - name: DISPATCHARR_ENV
              value: modular
            - name: DISPATCHARR_LOG_LEVEL
              value: info
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /
              port: 9191
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: dispatcharr-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery
  namespace: multimedia-factory
  annotations:
    keel.sh/policy: force
    keel.sh/trigger: poll
    keel.sh/matchTag: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: celery
  template:
    metadata:
      labels:
        app: celery
    spec:
      containers:
        - name: celery
          image: ghcr.io/dispatcharr/dispatcharr:latest
          imagePullPolicy: Always
          command: ["/app/docker/entrypoint.celery.sh"]
          envFrom:
            - secretRef:
                name: dispatcharr-secrets
          env:
            - name: DISPATCHARR_ENV
              value: modular
            - name: DISPATCHARR_PORT
              value: "9191"
            - name: DISPATCHARR_LOG_LEVEL
              value: info
            - name: DJANGO_SETTINGS_MODULE
              value: dispatcharr.settings
            - name: PYTHONUNBUFFERED
              value: "1"
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: dispatcharr-data
