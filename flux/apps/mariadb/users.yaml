apiVersion: k8s.mariadb.com/v1alpha1
kind: User
metadata:
  name: youtarr
  namespace: database
spec:
  mariaDbRef:
    name: mariadb
  passwordSecretKeyRef:
    name: mariadb-app-passwords
    key: youtarr

