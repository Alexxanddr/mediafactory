apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
    name: open-wearables
    namespace: extra-tools
spec:
    parentRefs:
        - name: traefik-gateway
          namespace: system-addon
    hostnames:
        - open-wearables.internal.skypiea.work
    rules:
        - matches:
            - path:
                type: PathPrefix
                value: /api
          filters:
            - type: URLRewrite
              urlRewrite:
                path:
                    type: ReplacePrefixMatch
                    replacePrefixMatch: /
          backendRefs:
            - name: open-wearables-backend
              port: 8000
        - matches:
            - path:
                type: PathPrefix
                value: /
          backendRefs:
            - name: open-wearables-frontend
              port: 3000
