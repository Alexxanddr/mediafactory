apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-wearables-backend
  namespace: extra-tools
  annotations:
    keel.sh/policy: force
    keel.sh/trigger: poll
    keel.sh/matchTag: "true"
    uptime-kuma.io/enabled: "true"
    uptime-kuma.io/type: http
    uptime-kuma.io/url: http://open-wearables-backend.extra-tools.svc:8000/
    uptime-kuma.io/name: open-wearables backend
    uptime-kuma.io/interval: "60"
    uptime-kuma.io/retries: "3"
    uptime-kuma.io/notifications: Monitoring Bot
    uptime-kuma.io/group: Utilities
spec:
  replicas: 1
  selector:
    matchLabels: {app: open-wearables-backend}
  template:
    metadata:
      annotations:
        config.mediafactory.io/postgres-service: postgres-longhorn-rw.database.svc.cluster.local
      labels: {app: open-wearables-backend}
    spec:
      enableServiceLinks: false
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: [sh, -c, 'until nc -z postgres-longhorn-rw.database.svc.cluster.local 5432; do sleep 2; done']
        - name: wait-for-redis
          image: busybox:1.36
          command: [sh, -c, 'until nc -z redis-master.database.svc.cluster.local 6379; do sleep 2; done']
      containers:
        - name: backend
          image: themomentum/open-wearables-backend:0.7.0
          imagePullPolicy: IfNotPresent
          command: [scripts/start/app.sh]
          envFrom: [{secretRef: {name: open-wearables-secret}}]
          env:
            - name: REDIS_PASSWORD
              valueFrom: {secretKeyRef: {name: redis-auth, key: redis-password, optional: false}}
          ports: [{name: http, containerPort: 8000}]
        - name: worker
          image: themomentum/open-wearables-backend:0.7.0
          imagePullPolicy: IfNotPresent
          command: [scripts/start/worker.sh]
          envFrom: [{secretRef: {name: open-wearables-secret}}]
          env:
            - name: REDIS_PASSWORD
              valueFrom: {secretKeyRef: {name: redis-auth, key: redis-password, optional: false}}
        - name: beat
          image: themomentum/open-wearables-backend:0.7.0
          imagePullPolicy: IfNotPresent
          command: [scripts/start/beat.sh]
          envFrom: [{secretRef: {name: open-wearables-secret}}]
          env:
            - name: REDIS_PASSWORD
              valueFrom: {secretKeyRef: {name: redis-auth, key: redis-password, optional: false}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-wearables-frontend
  namespace: extra-tools
  annotations:
    keel.sh/policy: force
    keel.sh/trigger: poll
    keel.sh/matchTag: "true"
    uptime-kuma.io/enabled: "true"
    uptime-kuma.io/type: http
    uptime-kuma.io/url: http://open-wearables-frontend.extra-tools.svc:3000
    uptime-kuma.io/name: open-wearables frontend
    uptime-kuma.io/interval: "60"
    uptime-kuma.io/retries: "3"
    uptime-kuma.io/notifications: Monitoring Bot
    uptime-kuma.io/group: Utilities
spec:
  replicas: 1
  selector:
    matchLabels: {app: open-wearables-frontend}
  template:
    metadata:
      labels: {app: open-wearables-frontend}
    spec:
      enableServiceLinks: false
      containers:
        - name: frontend
          image: themomentum/open-wearables-frontend:0.7.0
          imagePullPolicy: IfNotPresent
          env:
            - name: API_URL
              value: http://open-wearables-backend.extra-tools.svc:8000
            - name: VITE_API_URL
              valueFrom:
                secretKeyRef: {name: open-wearables-secret, key: VITE_API_URL}
          ports: [{name: http, containerPort: 3000}]
