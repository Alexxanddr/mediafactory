apiVersion: batch/v1
kind: Job
metadata:
  name: copy-animeworld-longhorn
  namespace: multimedia-factory
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 14400
  template:
    spec:
      restartPolicy: Never
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: copy
          image: python:3.13-alpine
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
          command:
            - /bin/sh
            - -ec
            - |
              source=/source/animeworld-script
              target=/target/animeworld-script
              if [ -d "$target/lost+found" ]; then
                [ -z "$(find "$target/lost+found" -mindepth 1 -print -quit)" ]
                rmdir "$target/lost+found"
              fi
              [ -z "$(find "$target" -mindepth 1 -print -quit)" ]
              cp -a "$source/." "$target/"
              sync
              (cd "$source" && find . -type f -print0 | sort -z | xargs -0 sha256sum) > /tmp/animeworld-script-source.sha256
              (cd "$target" && find . -type f -print0 | sort -z | xargs -0 sha256sum) > /tmp/animeworld-script-target.sha256
              diff -u /tmp/animeworld-script-source.sha256 /tmp/animeworld-script-target.sha256
              echo COPY_SHA256_OK animeworld-script
              python3 - <<'PYSQL'
              import glob, sqlite3
              roots = [
              ]
              paths = []
              for root in roots:
                  for pattern in ("**/*.db", "**/*.sqlite", "**/*.sqlite3"):
                      paths.extend(glob.glob(root + "/" + pattern, recursive=True))
              for path in sorted(set(paths)):
                  with sqlite3.connect("file:" + path + "?mode=ro", uri=True) as db:
                      result = db.execute("PRAGMA integrity_check").fetchone()[0]
                  if result != "ok":
                      raise SystemExit(f"SQLite integrity failure: {path}: {result}")
                  print(f"SQLITE_INTEGRITY_OK {path}")
              if not paths:
                  print("NO_SQLITE_DATABASES_IN_COPY")
              PYSQL
          volumeMounts:
            - name: source-animeworld-script
              mountPath: /source/animeworld-script
              readOnly: true
            - name: target-animeworld-script
              mountPath: /target/animeworld-script
      volumes:
        - name: source-animeworld-script
          persistentVolumeClaim:
            claimName: animeworld-script
            readOnly: true
        - name: target-animeworld-script
          persistentVolumeClaim:
            claimName: migration-animeworld-script
