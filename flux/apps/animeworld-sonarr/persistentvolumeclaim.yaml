apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: animeworld-database-longhorn
  namespace: multimedia-factory
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: longhorn-static
  volumeMode: Filesystem
  volumeName: animeworld-database
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: animeworld-script-longhorn
  namespace: multimedia-factory
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: longhorn-static
  volumeMode: Filesystem
  volumeName: animeworld-script
