apiVersion: apps/v1
kind: Deployment
metadata:
  name: italian-bus-search
  namespace: extra-tools
  annotations:
    keel.sh/policy: force
    keel.sh/trigger: poll
    keel.sh/matchTag: "true"
    uptime-kuma.io/enabled: "true"
    uptime-kuma.io/type: "http"
    uptime-kuma.io/url: "http://italian-bus-search.extra-tools.svc:3000/health"
    uptime-kuma.io/name: "italian-bus-search"
    uptime-kuma.io/interval: "60"
    uptime-kuma.io/retries: "3"
    uptime-kuma.io/notifications: "Monitoring Bot"
    uptime-kuma.io/group: "Utilities"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: italian-bus-search
  template:
    metadata:
      labels:
        app.kubernetes.io/name: italian-bus-search
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: update-rail-timetables
          image: ghcr.io/alexxanddr/italian-bus-search:latest
          imagePullPolicy: Always
          command: ["node", "dist/rail/update.js"]
          env:
            - name: NODE_OPTIONS
              value: --max-old-space-size=768
            - name: TRENITALIA_NETEX_PATH
              value: /app/data/trenitalia-timetable.json.gz
            - name: ITALO_NETEX_PATH
              value: /app/data/italo-timetable.json.gz
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /app/data
      containers:
        - name: italian-bus-search
          image: ghcr.io/alexxanddr/italian-bus-search:latest
          imagePullPolicy: Always
          env:
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: "3000"
            - name: TRENITALIA_NETEX_PATH
              value: /app/data/trenitalia-timetable.json.gz
            - name: ITALO_NETEX_PATH
              value: /app/data/italo-timetable.json.gz
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: italian-bus-search
