apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-source-longhorn-restore
spec:
  capacity:
    storage: 50Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-path
  claimRef:
    namespace: database
    name: postgres-1
  csi:
    driver: driver.longhorn.io
    fsType: ext4
    volumeHandle: pvc-6b0c3b6c-75ca-4b75-8b44-f1007db2323f
