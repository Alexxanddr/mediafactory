apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-source-longhorn-restore
spec:
  capacity:
    storage: 50Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-path
  claimRef:
    namespace: database
    name: postgres-1
  csi:
    driver: driver.longhorn.io
    fsType: ext4
    volumeHandle: pvc-dfce266f-8107-4c50-9149-780a8408ba04
