apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-backup-retention
  namespace: database
data:
  retention.py: |
    import json
    import ssl
    from pathlib import Path
    from urllib.parse import urlencode
    from urllib.request import Request, urlopen

    def expired(backups):
        completed = [b for b in backups if
                     b["spec"]["cluster"]["name"] == "postgres-longhorn"
                     and b["spec"].get("method") == "volumeSnapshot"
                     and b.get("status", {}).get("phase") == "completed"
                     and b["metadata"].get("labels", {}).get("cnpg.io/scheduled-backup")
                     == "postgres-longhorn-daily"]
        completed.sort(key=lambda b: b["status"]["stoppedAt"], reverse=True)
        return completed[7:]

    def main():
        account = Path("/var/run/secrets/kubernetes.io/serviceaccount")
        context = ssl.create_default_context(cafile=str(account / "ca.crt"))
        headers = {"Authorization": "Bearer " + (account / "token").read_text(),
                   "Content-Type": "application/json"}
        # Use in-cluster credentials; no kubeconfig is mounted in this pod.
        url = "https://kubernetes.default.svc/apis/postgresql.cnpg.io/v1/namespaces/database/backups"
        selector = urlencode({"labelSelector": "cnpg.io/scheduled-backup=postgres-longhorn-daily"})
        with urlopen(Request(url + "?" + selector, headers=headers), context=context, timeout=30) as response:
            backups = json.load(response)["items"]
        for backup in expired(backups):
            name = backup["metadata"]["name"]
            body = json.dumps({"apiVersion": "v1", "kind": "DeleteOptions",
                               "preconditions": {"uid": backup["metadata"]["uid"]}}).encode()
            with urlopen(Request(url + "/" + name, data=body, headers=headers, method="DELETE"),
                         context=context, timeout=30) as response:
                response.read()
            print("Deleted expired backup:", name, flush=True)
        print("Retention complete; kept the newest seven completed scheduled backups.", flush=True)

    if __name__ == "__main__":
        main()
