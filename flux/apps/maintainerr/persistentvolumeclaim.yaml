apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: maintainerr-config-longhorn
  namespace: multimedia-factory
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 2Gi
  storageClassName: longhorn-static
  volumeMode: Filesystem
  volumeName: maintainerr-config
