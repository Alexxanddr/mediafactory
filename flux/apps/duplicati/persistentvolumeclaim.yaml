apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: duplicati-data
  namespace: system-addon
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 100Gi
  storageClassName: local-path
  volumeMode: Filesystem
  volumeName: duplicati-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: duplicati-config-longhorn
  namespace: system-addon
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 4Gi
  storageClassName: longhorn-static
  volumeMode: Filesystem
  volumeName: duplicati-config
