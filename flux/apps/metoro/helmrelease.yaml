apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metoro-exporter
  namespace: system-addon
spec:
  interval: 30m
  chart:
    spec:
      chart: metoro-exporter
      sourceRef:
        kind: HelmRepository
        name: metoro
        namespace: flux-system
      interval: 1h

  values:
    redis:
      enabled: false

    exporter:
      secret:
        name: "metoro-exporter-secret"

        externalSecret:
          enabled: true
          name: "metoro-exporter-secret"
          secretKey: "AUTH_TOKEN"

      envVars:
        userDefined:
          REDIS_HOST: "redis-master.database.svc.cluster.local"
          REDIS_PORT: "6379"
          REDIS_DB: "5"