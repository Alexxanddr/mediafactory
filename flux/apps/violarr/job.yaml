apiVersion: batch/v1
kind: Job
metadata:
  name: fix-violarr-longhorn-permissions-final
  namespace: multimedia-factory
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: k3s-server
      containers:
        - name: fix-permissions
          image: ghcr.io/xbit18/violarr:latest
          securityContext:
            runAsUser: 100
            runAsGroup: 102
          command: ["bash", "-ceu"]
          args:
            - |
              stat -c '%a %u:%g %n' /data/postgres
              chmod 700 /data/postgres
              chmod g-s /data/postgres
              test "$(stat -c '%a' /data/postgres)" = 700
              pg_controldata /data/postgres | grep -E 'Database cluster state|Database system identifier|Data page checksum version'
              echo 'VIOLARR_LONGHORN_PERMISSIONS_OK'
          volumeMounts:
            - name: target
              mountPath: /data
      volumes:
        - name: target
          persistentVolumeClaim:
            claimName: migration-violarr-data
