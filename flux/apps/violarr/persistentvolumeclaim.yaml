apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: violarr-data
  namespace: multimedia-factory
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
  storageClassName: local-path
  volumeMode: Filesystem
  volumeName: violarr-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: migration-violarr-data
  namespace: multimedia-factory
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 8Gi
  storageClassName: longhorn-static
  volumeMode: Filesystem
  volumeName: migration-violarr-data
