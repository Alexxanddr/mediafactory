---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lingarr-config
  namespace: multimedia-factory
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 100Gi
  storageClassName: local-path
  volumeMode: Filesystem
  volumeName: lingarr-config
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lingarr-media
  namespace: multimedia-factory
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 100Gi
  storageClassName: local-path
  volumeMode: Filesystem
  volumeName: lingarr-media
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: migration-lingarr-config
  namespace: multimedia-factory
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: longhorn-static
  volumeMode: Filesystem
  volumeName: migration-lingarr-config
