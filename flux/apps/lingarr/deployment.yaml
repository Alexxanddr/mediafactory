apiVersion: apps/v1
kind: Deployment
metadata:
  name: lingarr
  namespace: multimedia-factory
  annotations:
    keel.sh/policy: force
    keel.sh/trigger: poll
    keel.sh/matchTag: "true"
    uptime-kuma.io/enabled: "true"
    uptime-kuma.io/type: "http"
    uptime-kuma.io/url: "http://lingarr.multimedia-factory.svc:9876"
    uptime-kuma.io/name: "lingarr"
    uptime-kuma.io/interval: "60"
    uptime-kuma.io/retries: "3"
    uptime-kuma.io/notifications: "Monitoring Bot"
    uptime-kuma.io/group: "Media & Streaming"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lingarr
  template:
    metadata:
      labels:
        app: lingarr
    spec:
      containers:
        - name: lingarr
          image: ghcr.io/lingarr-translate/lingarr:latest
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: lingarr-secrets
          env:
            - name: ASPNETCORE_URLS
              value: "http://+:9876"
          ports:
            - containerPort: 9876
          volumeMounts:
            - name: config
              mountPath: /app/config
            - name: media
              mountPath: /data/media/movies
              subPath: movies
            - name: media
              mountPath: /data/media/tv
              subPath: tv
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: lingarr-config
        - name: media
          persistentVolumeClaim:
            claimName: lingarr-media