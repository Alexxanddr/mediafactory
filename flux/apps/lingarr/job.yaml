apiVersion: batch/v1
kind: Job
metadata:
  name: copy-lingarr
  namespace: multimedia-factory
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: copy
          image: python:3.13-alpine
          command:
            - /bin/sh
            - -ec
            - |
              if [ -d /target/lost+found ]; then
                [ -z "$(find /target/lost+found -mindepth 1 -print -quit)" ]
                rmdir /target/lost+found
              fi
              [ -z "$(find /target -mindepth 1 -print -quit)" ]
              cp -a /source/. /target/
              sync
              (cd /source && find . -type f -print0 | sort -z | xargs -0 sha256sum) > /tmp/source.sha256
              (cd /target && find . -type f -print0 | sort -z | xargs -0 sha256sum) > /tmp/target.sha256
              diff -u /tmp/source.sha256 /tmp/target.sha256
              echo COPY_SHA256_OK
          volumeMounts:
            - name: source
              mountPath: /source
              readOnly: true
            - name: target
              mountPath: /target
      volumes:
        - name: source
          persistentVolumeClaim:
            claimName: lingarr-config
            readOnly: true
        - name: target
          persistentVolumeClaim:
            claimName: migration-lingarr-config
