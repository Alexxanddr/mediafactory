apiVersion: v1
kind: Service
metadata:
  name: hermes-agent
  namespace: hermes-agent
spec:
  type: ClusterIP
  selector:
    app: hermes-agent
  ports:
    - name: api
      protocol: TCP
      port: 8642
      targetPort: api
    - name: dashboard
      protocol: TCP
      port: 9119
      targetPort: dashboard
