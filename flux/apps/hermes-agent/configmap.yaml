apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-agent-config
  namespace: hermes-agent
data:
  config.yaml: |
    model:
      provider: custom:omniroute
      default: auto/best-coding
      api_mode: chat_completions
    custom_providers:
      - name: omniroute
        base_url: http://omniroute.omniroute.svc:20128/v1
        key_env: OMNIROUTE_API_KEY
        api_mode: chat_completions
    stt:
      enabled: true
      provider: groq
      language: it
    terminal:
      backend: local
    security:
      website_blocklist:
        enabled: true
        domains:
          - "*.cluster.local"
          - "localhost"
          - "127.0.0.1"
