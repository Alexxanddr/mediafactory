apiVersion: batch/v1
kind: Job
metadata:
  name: copy-hermes-agent
  namespace: hermes-agent
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: copy
          image: python:3.13-alpine
          command:
            - /bin/sh
            - -ec
            - |
              if [ -d /target/lost+found ]; then
                [ -z "$(find /target/lost+found -mindepth 1 -print -quit)" ]
                rmdir /target/lost+found
              fi
              [ -z "$(find /target -mindepth 1 -print -quit)" ]
              cp -a /source/. /target/
              sync
              (cd /source && find . -type f -print0 | sort -z | xargs -0 sha256sum) > /tmp/source.sha256
              (cd /target && find . -type f -print0 | sort -z | xargs -0 sha256sum) > /tmp/target.sha256
              diff -u /tmp/source.sha256 /tmp/target.sha256
              echo COPY_SHA256_OK
              python3 - <<'PYSQL'
              import os, sqlite3
              root="/target"
              paths=[]
              for current, _, files in os.walk(root):
                  for name in files:
                      if name.lower().endswith((".db", ".sqlite", ".sqlite3")):
                          paths.append(os.path.join(current, name))
              if not paths:
                  raise SystemExit("No SQLite databases found")
              for path in sorted(paths):
                  with sqlite3.connect(f"file:{path}?mode=ro", uri=True) as db:
                      result=db.execute("PRAGMA integrity_check").fetchone()[0]
                  if result!="ok":
                      raise SystemExit(f"SQLite integrity failure: {path}: {result}")
                  print(f"SQLITE_INTEGRITY_OK {path}")
              PYSQL
          volumeMounts:
            - name: source
              mountPath: /source
              readOnly: true
            - name: target
              mountPath: /target
      volumes:
        - name: source
          persistentVolumeClaim:
            claimName: hermes-agent-data
            readOnly: true
        - name: target
          persistentVolumeClaim:
            claimName: migration-hermes-agent-data
