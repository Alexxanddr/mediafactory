apiVersion: batch/v1
kind: Job
metadata:
  name: copy-sonarr-config-retry
  namespace: multimedia-factory
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: copy-and-check
          image: python:3.13-alpine
          command: ["/bin/sh", "-ec"]
          args:
            - |
              set -eu
              if [ -e /target/lost+found ]; then
                if [ ! -d /target/lost+found ] || [ -n "$(find /target/lost+found -mindepth 1 -print -quit)" ]; then echo "Target lost+found is not empty" >&2; exit 1; fi
                rmdir /target/lost+found
              fi
              if [ -n "$(find /target -mindepth 1 -print -quit)" ]; then echo "Target is not empty" >&2; exit 1; fi
              cp -a /source/. /target/
              sync
              (cd /source && find . -type f -exec sha256sum {} + | sort) > /tmp/source.sha
              (cd /target && find . -type f -exec sha256sum {} + | sort) > /tmp/target.sha
              diff -u /tmp/source.sha /tmp/target.sha
              echo COPY_SHA256_OK
              python3 -c 'import sqlite3,sys; p=sys.argv[1]; c=sqlite3.connect("file:"+p+"?mode=ro",uri=True); r=c.execute("PRAGMA integrity_check").fetchone()[0]; c.close(); print("SQLITE_INTEGRITY_OK",p); sys.exit(r != "ok")' /target/sonarr.db
              python3 -c 'import sqlite3,sys; p=sys.argv[1]; c=sqlite3.connect("file:"+p+"?mode=ro",uri=True); r=c.execute("PRAGMA integrity_check").fetchone()[0]; c.close(); print("SQLITE_INTEGRITY_OK",p); sys.exit(r != "ok")' /target/logs.db
          volumeMounts:
            - name: source
              mountPath: /source
              readOnly: true
            - name: target
              mountPath: /target
      volumes:
        - name: source
          persistentVolumeClaim:
            claimName: sonarr-config
            readOnly: true
        - name: target
          persistentVolumeClaim:
            claimName: migration-sonarr-config
