apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: changedetection-config-longhorn
  namespace: extra-tools
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: longhorn-static
  volumeMode: Filesystem
  volumeName: changedetection-config
