apiVersion: apps/v1
kind: Deployment
metadata:
  name: hinge-mcp
  namespace: extra-tools
  annotations:
    keel.sh/policy: force
    keel.sh/trigger: poll
    keel.sh/matchTag: "true"
    uptime-kuma.io/enabled: "true"
    uptime-kuma.io/type: "http"
    uptime-kuma.io/url: "http://hinge-mcp.extra-tools.svc:3939/healthz"
    uptime-kuma.io/name: "hinge-mcp"
    uptime-kuma.io/interval: "60"
    uptime-kuma.io/retries: "3"
    uptime-kuma.io/notifications: "Monitoring Bot"
    uptime-kuma.io/group: "Utilities"
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hinge-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hinge-mcp
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hinge-mcp
          image: ghcr.io/alexxanddr/hinge-mcp:latest
          imagePullPolicy: Always
          env:
            - name: HINGE_MCP_HOST
              value: 0.0.0.0
            - name: HINGE_MCP_PORT
              value: "3939"
            - name: HINGE_SESSION_FILE
              value: /data/hinge/session.json
            - name: HINGE_MCP_READ_ONLY
              value: "1"
          envFrom:
            - secretRef:
                name: hinge-mcp
          ports:
            - name: http
              containerPort: 3939
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data/hinge
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hinge-mcp
