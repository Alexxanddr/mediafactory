apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: romm-resources
  namespace: gaming
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 100Gi
  storageClassName: local-path
  volumeMode: Filesystem
  volumeName: romm-resources

