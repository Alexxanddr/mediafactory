apiVersion: apps/v1
kind: Deployment
metadata:
  name: romm
  namespace: gaming
  annotations:
    keel.sh/policy: force
    keel.sh/trigger: poll
    keel.sh/matchTag: "true"
    uptime-kuma.io/enabled: "true"
    uptime-kuma.io/type: "http"
    uptime-kuma.io/url: "http://romm.gaming.svc:8080"
    uptime-kuma.io/name: "romm"
    uptime-kuma.io/interval: "60"
    uptime-kuma.io/retries: "3"
    uptime-kuma.io/notifications: "Monitoring Bot"
    uptime-kuma.io/group: "Media & Streaming"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: romm
  template:
    metadata:
      labels:
        app: romm
    spec:
      enableServiceLinks: false
      containers:
        - name: romm
          image: rommapp/romm:latest
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: romm-db-secret
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: romm-resources
              mountPath: /romm/resources
            - name: romm-library
              mountPath: /romm/library
            - name: romm-assets
              mountPath: /romm/assets
            - name: romm-config
              mountPath: /romm/config
      volumes:
        - name: romm-resources
          persistentVolumeClaim:
            claimName: romm-resources
        - name: romm-library
          persistentVolumeClaim:
            claimName: romm-library
        - name: romm-assets
          persistentVolumeClaim:
            claimName: romm-assets
        - name: romm-config
          persistentVolumeClaim:
            claimName: romm-config
      initContainers:
        - name: wait-for-db
          image: busybox:1.28
          command: ['sh', '-c', 'until nc -z mariadb.database.svc.cluster.local 3306; do echo waiting for db; sleep 2; done;']
