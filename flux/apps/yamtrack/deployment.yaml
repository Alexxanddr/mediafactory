apiVersion: apps/v1
kind: Deployment
metadata:
  name: yamtrack
  namespace: multimedia-factory
  annotations:
    keel.sh/policy: force
    keel.sh/trigger: poll
    keel.sh/matchTag: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: yamtrack
  template:
    metadata:
      labels:
        app: yamtrack
    spec:
      enableServiceLinks: false
      containers:
        - name: yamtrack
          image: ghcr.io/fuzzygrim/yamtrack
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: yamtrack-secret
          ports:
            - containerPort: 8000
      initContainers:
        - name: wait-for-db
          image: busybox:1.28
          command: ['sh', '-c', 'until nc -z postgres-rw.database.svc.cluster.local 5432; do echo waiting for db; sleep 2; done;']
        - name: wait-for-redis
          image: busybox:1.28
          command: ['sh', '-c', 'until nc -z redis-master.database.svc.cluster.local 6379; do echo waiting for redis; sleep 2; done;']
