apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tranga-manga
  namespace: multimedia-factory
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 100Gi
  storageClassName: local-path
  volumeMode: Filesystem
  volumeName: tranga-manga
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tranga-settings-longhorn
  namespace: multimedia-factory
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 4Gi
  storageClassName: longhorn-static
  volumeMode: Filesystem
  volumeName: tranga-settings
