apiVersion: batch/v1
kind: Job
metadata:
  name: verify-anibridge-config
  namespace: multimedia-factory
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: sqlite-check
          image: python:3.13-alpine
          command: ["python3", "-c"]
          args:
            - |
              import sqlite3
              from pathlib import Path
              database = Path("/target/anibridge.db")
              if not database.is_file():
                  raise RuntimeError(f"SQLite database missing: {database}")
              connection = sqlite3.connect(database.as_uri() + "?mode=ro", uri=True)
              result = connection.execute("PRAGMA integrity_check").fetchone()[0]
              connection.close()
              if result != "ok":
                  raise RuntimeError(f"SQLite integrity failed: {result}")
              print(f"SQLITE_INTEGRITY_OK {database}")
          volumeMounts:
            - name: target
              mountPath: /target
      volumes:
        - name: target
          persistentVolumeClaim:
            claimName: migration-anibridge-config
