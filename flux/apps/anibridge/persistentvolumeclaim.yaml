apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: anibridge-config
  namespace: multimedia-factory
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
  storageClassName: local-path
  volumeMode: Filesystem
  volumeName: anibridge-config
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: migration-anibridge-config
  namespace: multimedia-factory
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 2Gi
  storageClassName: longhorn-static
  volumeMode: Filesystem
  volumeName: migration-anibridge-config
