apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vpn-gateway
  namespace: vpn-gateway
spec:
  releaseName: vpn-gateway
  interval: 1h
  dependsOn:
    - name: cert-manager
      namespace: cert-manager
  chart:
    spec:
      chart: ./charts/vpn-gateway
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: k8s-vpn-gateway
        namespace: flux-system
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 2m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 3m
  values:
    image: ghcr.io/alexxanddr/k8s-vpn-gateway@sha256:79c10b013e6b435d23ec55488d842ad10c5922bbe1bbb7709d37fae7a66a0ffd
    clusterDNS: 10.96.0.10
    vpnSecret: vpn-provider
    autoEnroll: true
    clientNamespaces:
      - vpn-apps
  postRenderers:
    - kustomize:
        patches:
          - patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: vpn-admission
                namespace: vpn-gateway
                annotations:
                  uptime-kuma.io/enabled: "true"
                  uptime-kuma.io/status-page: "true"
                  uptime-kuma.io/type: "tcp"
                  uptime-kuma.io/url: "vpn-admission.vpn-gateway.svc"
                  uptime-kuma.io/port: "443"
                  uptime-kuma.io/name: "vpn-gateway admission"
                  uptime-kuma.io/interval: "60"
                  uptime-kuma.io/retries: "3"
                  uptime-kuma.io/notifications: "Monitoring Bot"
                  uptime-kuma.io/group: "Network & Connectivity"
              spec:
                template:
                  spec:
                    containers:
                      - name: admission
                        imagePullPolicy: Always
          - patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: vpn-gateway
                namespace: vpn-gateway
              spec:
                template:
                  spec:
                    initContainers:
                      - name: forward-guard
                        imagePullPolicy: Always
                      - name: overlay
                        imagePullPolicy: Always
                    containers:
                      - name: gluetun
                        imagePullPolicy: Always
