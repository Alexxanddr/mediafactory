apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vpn-gateway
  namespace: vpn-gateway
spec:
  releaseName: vpn-gateway
  interval: 1h
  dependsOn:
    - name: cert-manager
      namespace: cert-manager
  chart:
    spec:
      chart: ./charts/vpn-gateway
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: k8s-vpn-gateway
        namespace: flux-system
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 2m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 3m
  values:
    image: ghcr.io/alexxanddr/k8s-vpn-gateway@sha256:ddc65ccd9045a2d6bde22c3443b9fe78c3e13e7a3c668189f4bda6b94f4e9f94
    clusterDNS: 10.96.0.10
    vpnSecret: vpn-provider
    autoEnroll: true
    clusterIngressCIDRs:
      - 10.244.0.0/16
    clientNamespaces:
      - vpn-apps
  postRenderers:
    - kustomize:
        patches:
          - patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: vpn-admission
                namespace: vpn-gateway
                annotations:
                  uptime-kuma.io/enabled: "true"
                  uptime-kuma.io/status-page: "true"
                  uptime-kuma.io/type: "tcp"
                  uptime-kuma.io/url: "vpn-admission.vpn-gateway.svc"
                  uptime-kuma.io/port: "443"
                  uptime-kuma.io/name: "vpn-gateway admission"
                  uptime-kuma.io/interval: "60"
                  uptime-kuma.io/retries: "3"
                  uptime-kuma.io/notifications: "Monitoring Bot"
                  uptime-kuma.io/group: "Network & Connectivity"
              spec:
                template:
                  spec:
                    containers:
                      - name: admission
                        imagePullPolicy: Always
          - patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: vpn-gateway
                namespace: vpn-gateway
                annotations:
                  uptime-kuma.io/enabled: "true"
                  uptime-kuma.io/status-page: "true"
                  uptime-kuma.io/type: "http"
                  uptime-kuma.io/url: "http://vpn-gateway.vpn-gateway.svc:9999/"
                  uptime-kuma.io/name: "vpn-gateway"
                  uptime-kuma.io/interval: "60"
                  uptime-kuma.io/retries: "3"
                  uptime-kuma.io/notifications: "Monitoring Bot"
                  uptime-kuma.io/group: "Network & Connectivity"
              spec:
                template:
                  spec:
                    initContainers:
                      - name: forward-guard
                        imagePullPolicy: Always
                      - name: overlay
                        imagePullPolicy: Always
                    containers:
                      - name: gluetun
                        imagePullPolicy: Always
                        env:
                          - name: HEALTH_SERVER_ADDRESS
                            value: "0.0.0.0:9999"
                          - name: FIREWALL_INPUT_PORTS
                            value: "1194,9999"
          - patch: |
              apiVersion: v1
              kind: Service
              metadata:
                name: vpn-gateway
                namespace: vpn-gateway
              spec:
                ports:
                  - name: health
                    port: 9999
                    targetPort: 9999
                    protocol: TCP
