apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: youtarr-data
  namespace: multimedia-factory
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 100Gi
  storageClassName: local-path
  volumeMode: Filesystem
  volumeName: youtarr-data

