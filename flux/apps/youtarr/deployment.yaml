apiVersion: apps/v1
kind: Deployment
metadata:
  name: youtarr
  namespace: multimedia-factory
  annotations:
    keel.sh/policy: force
    keel.sh/trigger: poll
    keel.sh/matchTag: "true"
    uptime-kuma.io/enabled: "true"
    uptime-kuma.io/type: "http"
    uptime-kuma.io/url: "http://youtarr.multimedia-factory.svc:3011"
    uptime-kuma.io/name: "youtarr"
    uptime-kuma.io/interval: "60"
    uptime-kuma.io/retries: "3"
    uptime-kuma.io/notifications: "Monitoring Bot"
    uptime-kuma.io/group: "Arr Stack"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: youtarr
  template:
    metadata:
      labels:
        app: youtarr
    spec:
      enableServiceLinks: false
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      containers:
        - name: youtarr
          image: dialmaster/youtarr:latest
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: youtarr-db-secret
            - configMapRef:
                name: youtarr-config
          ports:
            - containerPort: 3011
          volumeMounts:
            - name: youtarr-data
              mountPath: /usr/src/app/data
            - name: youtarr-images
              mountPath: /app/server/images
            - name: youtarr-config
              mountPath: /app/config
            - name: youtarr-jobs
              mountPath: /app/jobs
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3011
            initialDelaySeconds: 40
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3011
            initialDelaySeconds: 40
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
      volumes:
        - name: youtarr-data
          persistentVolumeClaim:
            claimName: youtarr-data
        - name: youtarr-images
          persistentVolumeClaim:
            claimName: youtarr-images
        - name: youtarr-config
          persistentVolumeClaim:
            claimName: youtarr-config
        - name: youtarr-jobs
          persistentVolumeClaim:
            claimName: youtarr-jobs
      initContainers:
        - name: wait-for-db
          image: busybox:1.28
          command: ['sh', '-c', 'until nc -z mariadb.database.svc.cluster.local 3306; do echo waiting for db; sleep 2; done;']
