apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: autobrr-config
  namespace: multimedia-factory
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
  storageClassName: local-path
  volumeMode: Filesystem
  volumeName: autobrr-config
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: migration-autobrr-config
  namespace: multimedia-factory
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
  storageClassName: longhorn-static
  volumeMode: Filesystem
  volumeName: migration-autobrr-config
