apiVersion: apps/v1
kind: Deployment
metadata:
  name: tracearr
  namespace: multimedia-factory
  annotations:
    keel.sh/policy: force
    keel.sh/trigger: poll
    keel.sh/matchTag: "true"
    uptime-kuma.io/enabled: "true"
    uptime-kuma.io/type: "http"
    uptime-kuma.io/url: "http://tracearr.multimedia-factory.svc:3000"
    uptime-kuma.io/name: "tracearr"
    uptime-kuma.io/interval: "60"
    uptime-kuma.io/retries: "3"
    uptime-kuma.io/notifications: "Monitoring Bot"
    uptime-kuma.io/group: "Arr Stack"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tracearr
  template:
    metadata:
      labels:
        app: tracearr
    spec:
      containers:
        - name: tracearr
          image: ghcr.io/connorgallopo/tracearr:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: tracearr-secret
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: HOST
              value: "0.0.0.0"
            - name: TZ
              value: UTC
          volumeMounts:
            - name: backup
              mountPath: /data/backup
      volumes:
        - name: backup
          persistentVolumeClaim:
            claimName: tracearr-config
