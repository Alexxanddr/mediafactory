apiVersion: apps/v1
kind: Deployment
metadata:
  name: tracearr-redis
  namespace: multimedia-factory
  annotations:
    keel.sh/policy: force
    keel.sh/trigger: poll
    keel.sh/matchTag: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tracearr-redis
  template:
    metadata:
      labels:
        app: tracearr-redis
    spec:
      containers:
        - name: redis
          image: redis:8-alpine
          imagePullPolicy: Always
          args: ["redis-server", "--appendonly", "yes"]
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: tracearr-redis-config
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tracearr
  namespace: multimedia-factory
  annotations:
    keel.sh/policy: force
    keel.sh/trigger: poll
    keel.sh/matchTag: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tracearr
  template:
    metadata:
      labels:
        app: tracearr
    spec:
      containers:
        - name: tracearr
          image: ghcr.io/connorgallopo/tracearr:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: tracearr-secret
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: HOST
              value: "0.0.0.0"
            - name: TZ
              value: UTC
          volumeMounts:
            - name: backup
              mountPath: /data/backup
      volumes:
        - name: backup
          persistentVolumeClaim:
            claimName: tracearr-config
