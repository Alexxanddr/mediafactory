apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tracearr-config
  namespace: multimedia-factory
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 100Gi
  storageClassName: local-path
  volumeMode: Filesystem
  volumeName: tracearr-config
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: migration-tracearr-timescale
  namespace: multimedia-factory
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: longhorn-static
  volumeMode: Filesystem
  volumeName: migration-tracearr-timescale
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tracearr-config-longhorn
  namespace: multimedia-factory
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: longhorn-static
  volumeMode: Filesystem
  volumeName: tracearr-config-longhorn
