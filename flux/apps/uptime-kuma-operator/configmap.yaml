apiVersion: v1
kind: ConfigMap
metadata:
  name: uptime-kuma-ownership-v110
  namespace: extra-tools
data:
  migrate.py: |
    """One-time, idempotent ownership-only migration; never creates/deletes monitors."""
    import hashlib
    import json
    import os
    from kubernetes import client,config
    from uptime_kuma_api import UptimeKumaApi

    plan=json.load(open('/migration/plan.json'))
    def description_digest(value):
        return hashlib.sha256(json.dumps(value,sort_keys=True).encode()).hexdigest()
    def digest(monitor):
        values={key:monitor.get(key) for key in plan['fields']}
        return hashlib.sha256(json.dumps(values,sort_keys=True,separators=(',',':'),default=str).encode()).hexdigest()

    config.load_incluster_config()
    apps=client.AppsV1Api()
    for entry in plan['entries']:
        method={'Deployment':'deployment','StatefulSet':'stateful_set','DaemonSet':'daemon_set'}[entry['kind']]
        body=getattr(apps,'read_namespaced_'+method)(entry['resource'],entry['namespace'])
        assert body.metadata.uid==entry['uid'],'Workload identity changed; migration refused'

    api=UptimeKumaApi(os.environ['KUMA_URL'],timeout=30)
    try:
        api.login(os.environ['KUMA_USER'],os.environ['KUMA_PASS'])
        observed={m['id']:api.get_monitor(m['id']) for m in api.get_monitors()}
        assert sorted(observed)==sorted(x['id'] for x in plan['baseline']),'Monitor inventory changed'
        mapped_ids={entry['id'] for entry in plan['entries']}
        for row in plan['baseline']:
            assert digest(observed[row['id']])==row['digest'],'Monitor settings changed before migration'
            if row['id'] not in mapped_ids:
                assert description_digest(observed[row['id']].get('description'))==row['description_digest'],'Unmanaged description changed'
        for entry in plan['entries']:
            monitor=observed[entry['id']]
            assert monitor.get('description') in (entry['old_description'],entry['description']),'Ownership changed'
        for entry in plan['entries']:
            if observed[entry['id']].get('description')!=entry['description']:
                api.edit_monitor(entry['id'],description=entry['description'])
            monitor=api.get_monitor(entry['id'])
            assert digest(monitor)==next(x['digest'] for x in plan['baseline'] if x['id']==entry['id']),'Settings changed during ownership edit'
        after={m['id']:api.get_monitor(m['id']) for m in api.get_monitors()}
        assert set(after)==set(observed),'Monitor IDs changed'
        descriptions={e['id']:e['description'] for e in plan['entries']}
        for row in plan['baseline']:
            monitor=after[row['id']]
            assert digest(monitor)==row['digest'],'Monitor settings changed'
            expected=description_digest(descriptions[row['id']]) if row['id'] in descriptions else row['description_digest']
            assert description_digest(monitor.get('description'))==expected,'Unexpected ownership edit'
        print('Ownership migration verified: %d updated identities; all %d monitor IDs/settings preserved' % (len(plan['entries']),len(after)),flush=True)
    finally:
        api.disconnect()
