apiVersion: apps/v1
kind: Deployment
metadata:
  name: uptime-kuma-operator
  namespace: extra-tools
  annotations:
    keel.sh/policy: force
    keel.sh/trigger: poll
    keel.sh/matchTag: 'true'
    uptime-kuma.io/enabled: 'true'
    uptime-kuma.io/type: ping
    uptime-kuma.io/url: uptime-kuma-operator.extra-tools.svc.cluster.local
    uptime-kuma.io/name: uptime-kuma-operator
    uptime-kuma.io/interval: '60'
    uptime-kuma.io/retries: '3'
    uptime-kuma.io/notifications: Monitoring Bot
    uptime-kuma.io/group: Monitoring & Observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: uptime-kuma-operator
  template:
    metadata:
      labels:
        app: uptime-kuma-operator
        app.kubernetes.io/version: 1.1.0
    spec:
      serviceAccountName: uptime-kuma-operator
      automountServiceAccountToken: true
      containers:
      - name: operator
        image: ghcr.io/alexxanddr/uptime-kuma-operator:1.1.0
        imagePullPolicy: Always
        command:
        - kopf
        args:
        - run
        - --all-namespaces
        - --standalone
        - --liveness=http://0.0.0.0:8080/healthz
        - operator.py
        env:
        - name: KUMA_URL
          valueFrom:
            secretKeyRef:
              name: uptime-kuma-creds
              key: url
        - name: KUMA_USER
          valueFrom:
            secretKeyRef:
              name: uptime-kuma-creds
              key: user
        - name: KUMA_PASS
          valueFrom:
            secretKeyRef:
              name: uptime-kuma-creds
              key: pass
        - name: LOG_LEVEL
          value: INFO
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        ports:
        - name: health
          containerPort: 8080
        readinessProbe:
          httpGet:
            path: /healthz
            port: health
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /healthz
            port: health
          periodSeconds: 5
          failureThreshold: 24
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: tmp
        emptyDir: {}
  strategy:
    type: Recreate
    rollingUpdate: null
