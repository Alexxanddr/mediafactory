apiVersion: apps/v1
kind: Deployment
metadata:
  name: uptime-kuma-operator
  namespace: extra-tools
  annotations:
    keel.sh/policy: force
    keel.sh/trigger: poll
    keel.sh/matchTag: 'true'
    uptime-kuma.io/enabled: 'true'
    uptime-kuma.io/status-page: "true"
    uptime-kuma.io/type: ping
    uptime-kuma.io/url: uptime-kuma-operator.extra-tools.svc.cluster.local
    uptime-kuma.io/name: uptime-kuma-operator
    uptime-kuma.io/interval: '60'
    uptime-kuma.io/retries: '3'
    uptime-kuma.io/notifications: Monitoring Bot
    uptime-kuma.io/group: Monitoring & Observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: uptime-kuma-operator
  template:
    metadata:
      labels:
        app: uptime-kuma-operator
        app.kubernetes.io/version: 1.2.0
    spec:
      serviceAccountName: uptime-kuma-operator
      automountServiceAccountToken: true
      containers:
      - name: operator
        image: ghcr.io/alexxanddr/uptime-kuma-operator:1.2.0
        imagePullPolicy: Always
        command:
        - kopf
        args:
        - run
        - --all-namespaces
        - --standalone
        - --liveness=http://0.0.0.0:8080/healthz
        - operator.py
        env:
        - name: KUMA_URL
          valueFrom:
            secretKeyRef:
              name: uptime-kuma-creds
              key: url
        - name: KUMA_USER
          valueFrom:
            secretKeyRef:
              name: uptime-kuma-creds
              key: user
        - name: KUMA_PASS
          valueFrom:
            secretKeyRef:
              name: uptime-kuma-creds
              key: pass
        - name: KUMA_STATUS_PAGE_SLUG
          value: "k8s-services"
        - name: KUMA_STATUS_PAGE_ID
          value: "2"
        - name: KUMA_STATUS_PAGE_GROUPS
          value: "{\"102\":9,\"103\":10,\"106\":11,\"105\":12,\"107\":13,\"104\":14,\"108\":15}"
        - name: KUMA_STATUS_PAGE_MONITORS
          value: "[109,113,114,115,116,117,118,119,120,121,122,123,124,125,126,127,128,129,130,131,132,133,134,135,136,137,139,140,141,142,143,145,146,147,148,150,151,158,160,161,162,163,165,170,172,173,189,190,194,195,198,199,200,201,202,204,205,206,207,208,209,210,213,220,221,224,225,228,231,232,233,235,236,237,238,239,240,241,242,243,244,245]"
        - name: LOG_LEVEL
          value: INFO
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        ports:
        - name: health
          containerPort: 8080
        readinessProbe:
          httpGet:
            path: /healthz
            port: health
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /healthz
            port: health
          periodSeconds: 5
          failureThreshold: 24
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: tmp
        emptyDir: {}
  strategy:
    type: Recreate
    rollingUpdate: null
