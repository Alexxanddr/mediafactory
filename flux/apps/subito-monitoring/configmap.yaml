apiVersion: v1
kind: ConfigMap
metadata:
  name: subito-monitoring
  namespace: extra-tools
data:
  SM_TRANSPORT: http
  SM_HOST: 0.0.0.0
  SM_PORT: "8000"
  SM_DATABASE: /data/monitor.sqlite3
  SM_ALLOWED_HOSTS: '["127.0.0.1:*","localhost:*","subito-monitoring:8000","subito-monitoring.extra-tools:8000","subito-monitoring.extra-tools.svc:8000","subito-monitoring.extra-tools.svc.cluster.local:8000"]'
  SM_MAX_PAGES: "5"
  SM_REQUEST_TIMEOUT: "15"
  SM_REQUEST_ATTEMPTS: "3"
  SM_SCAN_TIMEOUT: "300"
  SM_TICK_SECONDS: "5"
  SM_FAILURE_ALERT_SECONDS: "3600"
  SM_UPSTREAM_ENABLED: "true"
