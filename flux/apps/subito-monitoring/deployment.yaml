apiVersion: apps/v1
kind: Deployment
metadata:
  name: subito-monitoring
  namespace: extra-tools
  annotations:
    keel.sh/policy: force
    keel.sh/trigger: poll
    keel.sh/matchTag: "true"
    uptime-kuma.io/enabled: "true"
    uptime-kuma.io/status-page: "true"
    uptime-kuma.io/type: "http"
    uptime-kuma.io/url: "http://subito-monitoring.extra-tools.svc:8000/health/live"
    uptime-kuma.io/name: "subito-monitoring"
    uptime-kuma.io/interval: "60"
    uptime-kuma.io/retries: "3"
    uptime-kuma.io/notifications: "Monitoring Bot"
    uptime-kuma.io/group: "Utilities"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: subito-monitoring
  template:
    metadata:
      annotations:
        checksum/config: 9a9721177233696977c0ccc2be48078b56056fc36af7565b880968fed0677cd0
      labels:
        app.kubernetes.io/name: subito-monitoring
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: subito-monitoring
          image: ghcr.io/alexxanddr/subito-monitoring:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: subito-monitoring
            - secretRef:
                name: subito-monitoring
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 20
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: subito-monitoring-longhorn
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
