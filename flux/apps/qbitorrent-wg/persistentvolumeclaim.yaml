apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qbittorrent-wg-config-longhorn
  namespace: qbittorrent-wg
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: longhorn-static
  volumeMode: Filesystem
  volumeName: qbittorrent-wg-config-dedicated
