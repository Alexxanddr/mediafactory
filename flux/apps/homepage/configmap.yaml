        password: {{HOMEPAGE_VAR_UBIQUITI_UDR7_PASSWORD}}
    - unifi_console:
        url: {{HOMEPAGE_VAR_UBIQUITI_UCGULTRA_URL}}
        username: {{HOMEPAGE_VAR_UBIQUITI_UCGULTRA_USER}}
        password: {{HOMEPAGE_VAR_UBIQUITI_UCGULTRA_PASSWORD}}
