apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  namespace: multimedia-factory
  labels:
    app.kubernetes.io/name: homepage
data:
  kubernetes.yaml: |
    mode: cluster
  settings.yaml: |
    title: "Alexxanddr's HomeLab"
    description: "HomeLab control center"
    theme: dark
    color: teal
    language: en
    target: _blank

    # providers:
    #   openweathermap: openweathermapapikey
    quicklaunch:
      searchDescriptions: true
      hideInternetSearch: true
      showSearchSuggestions: true
      hideVisitURL: true
      provider: google # google, duckduckgo, bing, baidu, brave or custom

    cardBlur: md
    useEqualHeights: true
    hideErrors: false
    disableCollapse: true
    hideVersion: true
    showStats: true
    statusStyle: dot
    headerStyle: clean
    disableUpdateCheck: false

    layout:
      Arr Stack:
        header: true
        style: row
        columns: 5
      OtherArr:
        header: false
        style: row
        columns: 5
      Media Stack:
        style: row
        columns: 5
      OtherMedia:
        header: false
        style: row
        columns: 6
      Infra Stack:
        style: row
        columns: 5
      OtherInfra:
        header: false
        style: row
        columns: 5

      Tools:
        style: row
        columns: 4
      OtherTools:
        header: false
        style: row
        columns: 6
  custom.css: |
    :root {
      --homelab-accent: 45, 212, 191;
      --homelab-accent-strong: 20, 184, 166;
      --homelab-surface: 10, 24, 32;
      --homelab-border: 94, 234, 212;
    }

    /* Deep teal canvas with enough contrast behind translucent cards. */
    body {
      background:
        radial-gradient(circle at 10% -8%, rgba(var(--homelab-accent), 0.24), transparent 34rem),
        radial-gradient(circle at 92% 6%, rgba(6, 182, 212, 0.20), transparent 32rem),
        radial-gradient(circle at 50% 105%, rgba(13, 148, 136, 0.12), transparent 38rem),
        linear-gradient(155deg, #030b10 0%, #07151c 46%, #041016 100%);
      background-attachment: fixed;
    }

    body::before,
    body::after {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      content: "";
    }

    body::before {
      background:
        radial-gradient(circle at 22% 28%, rgba(45, 212, 191, 0.14), transparent 18rem),
        radial-gradient(circle at 78% 62%, rgba(34, 211, 238, 0.10), transparent 22rem);
      filter: blur(24px);
      animation: homelab-aurora 18s ease-in-out infinite alternate;
    }

    body::after {
      opacity: 0.12;
      background-image:
        linear-gradient(rgba(94, 234, 212, 0.13) 1px, transparent 1px),
        linear-gradient(90deg, rgba(94, 234, 212, 0.13) 1px, transparent 1px);
      background-size: 52px 52px;
      mask-image: linear-gradient(to bottom, black, transparent 72%);
    }

    @keyframes homelab-aurora {
      from { transform: translate3d(-3%, -2%, 0) scale(1); }
      to { transform: translate3d(4%, 3%, 0) scale(1.12); }
    }

    #page_container {
      max-width: 1920px;
      margin-inline: auto;
      padding-bottom: 3rem;
    }

    /* Keep the control-center header airy and visually separate. */
    #information-widgets {
      position: relative;
      margin-bottom: 2.25rem;
      padding: 0.6rem;
      overflow: hidden;
      border: 1px solid rgba(var(--homelab-border), 0.18);
      border-radius: 1.2rem;
      background: linear-gradient(120deg, rgba(13, 35, 44, 0.78), rgba(7, 25, 34, 0.58));
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.28), inset 0 1px rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(20px) saturate(125%);
    }

    #widgets-wrap {
      align-items: center;
    }

    #information-widgets::before {
      position: absolute;
      inset: 0 auto 0 0;
      width: 3px;
      content: "";
      background: linear-gradient(to bottom, #5eead4, #22d3ee, transparent);
      box-shadow: 0 0 24px rgba(var(--homelab-accent), 0.75);
    }

    /* Section headings form a clearer hierarchy without adding visual weight. */
    #services .services-group {
      margin-bottom: 2rem;
    }

    #services .services-group > h2 {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      margin-bottom: 0.9rem;
      color: rgba(240, 253, 250, 0.92);
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      text-shadow: 0 0 18px rgba(var(--homelab-accent), 0.25);
    }

    #services .services-group > h2::before {
      width: 0.45rem;
      height: 0.45rem;
      flex: 0 0 auto;
      border-radius: 999px;
      content: "";
      background: rgb(var(--homelab-accent));
      box-shadow: 0 0 0 4px rgba(var(--homelab-accent), 0.08), 0 0 16px rgba(var(--homelab-accent), 0.7);
    }

    #services .services-group > h2::after {
      height: 1px;
      flex: 1;
      content: "";
      background: linear-gradient(to right, rgba(var(--homelab-accent), 0.28), transparent 70%);
    }

    /* Glass cards, restrained borders and a small interactive lift. */
    .service-card {
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(var(--homelab-border), 0.11) !important;
      border-radius: 1rem !important;
      background: linear-gradient(
        145deg,
        rgba(18, 43, 53, 0.88),
        rgba(var(--homelab-surface), 0.78)
      ) !important;
      box-shadow: 0 5px 14px rgba(0, 0, 0, 0.18), inset 0 1px rgba(255, 255, 255, 0.035);
      backdrop-filter: blur(14px) saturate(115%);
      transition: transform 180ms ease, border-color 180ms ease, box-shadow 180ms ease;
    }

    .service-card::before {
      position: absolute;
      inset: 0 14% auto;
      height: 1px;
      content: "";
      background: linear-gradient(to right, transparent, rgba(var(--homelab-accent), 0.62), transparent);
      opacity: 0.5;
      transition: inset 180ms ease, opacity 180ms ease;
    }

    .service-card:hover {
      z-index: 2;
      transform: translateY(-4px) scale(1.012);
      border-color: rgba(var(--homelab-border), 0.42) !important;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.26), 0 0 22px rgba(var(--homelab-accent), 0.08);
    }

    .service-card:hover::before {
      inset-inline: 4%;
      opacity: 1;
    }

    .service-card img {
      filter: drop-shadow(0 5px 8px rgba(0, 0, 0, 0.28));
      transition: transform 180ms ease, filter 180ms ease;
    }

    .service-card:hover img {
      transform: scale(1.08);
      filter: drop-shadow(0 0 10px rgba(var(--homelab-accent), 0.25));
    }

    .service-card .description {
      color: rgba(203, 213, 225, 0.72) !important;
    }

    /* Widget values stay readable while their labels recede slightly. */
    .service-card .service-container > div:last-child {
      border-color: rgba(var(--homelab-border), 0.08) !important;
    }

    /* Blend metric blocks into the card instead of showing a hard second layer. */
    .service-card .service-block {
      min-width: 0;
      min-height: 3.15rem;
      margin: 0.18rem !important;
      padding: 0.3rem 0.2rem !important;
      border: 1px solid rgba(var(--homelab-border), 0.045);
      background: linear-gradient(
        180deg,
        rgba(20, 68, 73, 0.20),
        rgba(5, 31, 39, 0.10)
      ) !important;
      box-shadow: inset 0 1px rgba(255, 255, 255, 0.018);
    }

    .service-card .service-block > div {
      max-width: 100%;
      overflow: visible;
      text-overflow: clip;
      white-space: normal;
      overflow-wrap: anywhere;
    }

    .service-card .service-block > div:first-child {
      font-size: clamp(0.62rem, 0.72vw, 0.8rem);
      line-height: 1.1;
    }

    .service-card .service-block > div:last-child {
      font-size: clamp(0.52rem, 0.62vw, 0.68rem);
      line-height: 1.12;
    }

    .service-card .uppercase {
      letter-spacing: 0.055em;
      opacity: 0.66;
    }

    @media (max-width: 768px) {
      #page_container {
        padding-inline: 0.85rem;
      }

      #information-widgets {
        margin-bottom: 1.25rem;
        padding: 0.65rem;
      }

      #services .services-group {
        margin-bottom: 1.5rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      body::before {
        animation: none;
      }

      .service-card {
        transition: none;
      }

      .service-card:hover {
        transform: none;
      }
    }
  custom.js: ""
  # docker.yaml: ""
  bookmarks.yaml: ""
  services.yaml: |
    - Arr Stack:
        - Radarr:
            icon: radarr.png
            href: https://radarr.{{HOMEPAGE_VAR_INTERNAL_DOMAIN}}
            description: Movies, Docs all 1080
            showStats: false
