  widgets.yaml: |
    - greeting:
        text_size: xl
        text: Alexxanddr's HomeLab
    - openmeteo:
        label: Rome
        latitude: 41.86094060191091
        longitude: 12.558304332495656
        timezone: Europe/Rome
        units: metric # or imperial
        cache: 5 # Time in minutes to cache API responses, to stay within limits
        format: # optional, Intl.NumberFormat options
          maximumFractionDigits: 1
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "cluster"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - resources:
        backend: resources
        expanded: true
        cpu: true
        memory: true
        network: default
    - unifi_console:
        url: {{HOMEPAGE_VAR_UBIQUITI_UDR7_URL}}
