apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pihole
  namespace: extra-tools
spec:
  releaseName: pihole
  interval: 5m
  chart:
    spec:
      chart: pihole
      sourceRef:
        kind: HelmRepository
        name: pihole
        namespace: flux-system
  values:
    podAnnotations:
      uptime-kuma.io/enabled: "true"
      uptime-kuma.io/type: "http"
      uptime-kuma.io/url: "http://pihole-web.extra-tools.svc:80"
      uptime-kuma.io/name: "pihole"
      uptime-kuma.io/interval: "60"
      uptime-kuma.io/retries: "3"
      uptime-kuma.io/notifications: "Monitoring Bot"
      uptime-kuma.io/group: "Network & Connectivity"
    image:
      tag: "latest"
      pullPolicy: Always
    replicaCount: 1
    ingress:
      enabled: false
    serviceWeb:
      type: ClusterIP
    serviceDhcp:
      enabled: false
    dnsHostPort:
      enabled: true
      port: 53
    admin:
      enabled: true
      existingSecret: pihole-credentials
    doh:
      enabled: true
      pullPolicy: Always
      envVars:
        DOH_UPSTREAM: 'https://1.1.1.1/dns-query'
    persistentVolumeClaim:
      enabled: true
      existingClaim: pihole-config
